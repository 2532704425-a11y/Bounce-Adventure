<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Slingshot Adventure - 弹射大冒险</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#f6c451;--gold-deep:#b97822;--red:#d84733;--red-deep:#7f2018;--sea:#0b1a18;--panel:rgba(18,12,8,.72);--paper:#f7e4bf;--line:rgba(255,232,182,.22)}
html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#120804,#040201);font-family:'Segoe UI','Microsoft YaHei','Hiragino Sans',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{color:#fff}
canvas#gameCanvas{display:block;position:absolute;top:0;left:0;z-index:1}
#ui-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;display:none}
#ui-layer>*{pointer-events:auto}
#health-bar{position:absolute;top:18px;left:18px;width:clamp(188px,30vw,260px);height:54px;padding:16px 14px 10px 56px;background:linear-gradient(180deg,rgba(56,28,14,.92),rgba(20,10,6,.84));border:1px solid rgba(255,221,149,.34);border-radius:18px;box-shadow:0 14px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(8px)}
#health-bar::before{content:attr(data-label);position:absolute;left:56px;top:8px;font-size:10px;letter-spacing:3px;color:rgba(255,226,173,.86)}
#energy-fill{height:16px;border-radius:999px;transition:width .25s;position:relative;overflow:hidden;margin-top:12px}
#energy-fill::after{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:rgba(255,255,255,.24);border-radius:999px 999px 0 0}
#energy-text{position:absolute;right:14px;top:8px;font-size:18px;font-weight:900;color:#fff7e3;text-shadow:0 2px 4px rgba(0,0,0,.55);line-height:1;pointer-events:none}
#energy-icon{position:absolute;left:14px;top:9px;width:34px;height:34px;object-fit:contain;filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))}
#collect-counter{position:absolute;top:18px;right:18px;min-width:148px;height:54px;padding:12px 18px 10px;background:linear-gradient(180deg,rgba(28,48,28,.9),rgba(10,20,12,.84));border:1px solid rgba(153,255,183,.22);border-radius:18px;color:#fff7e3;display:flex;align-items:flex-end;justify-content:center;gap:10px;font-size:20px;font-weight:900;box-shadow:0 14px 30px rgba(0,0,0,.28);backdrop-filter:blur(8px)}
#counterLabel{position:absolute;top:7px;left:18px;font-size:10px;letter-spacing:2px;color:rgba(214,247,201,.74)}
#counterIcon{width:26px;height:26px;object-fit:contain;line-height:1}
#cTxt{line-height:1}
#miniMapCanvas{display:none!important}
#skill-panel{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:none;gap:10px;flex-wrap:wrap;justify-content:center;max-width:min(720px,calc(100vw - 220px))}
.skill-btn{min-width:110px;padding:10px 12px 9px;border-radius:18px;border:1px solid rgba(255,235,190,.2);background:linear-gradient(180deg,rgba(38,28,55,.92),rgba(15,10,24,.9));color:#fffbe7;box-shadow:0 10px 24px rgba(0,0,0,.26);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-weight:900;transition:transform .16s ease,box-shadow .16s ease,filter .16s ease}
.skill-btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(0,0,0,.34)}
.skill-btn:disabled{cursor:not-allowed;filter:grayscale(.2) brightness(.72);transform:none;box-shadow:0 8px 16px rgba(0,0,0,.2)}
.skill-btn.active{background:linear-gradient(180deg,rgba(255,197,90,.98),rgba(220,118,34,.92));color:#5b2408;border-color:rgba(255,241,210,.5)}
.skill-name{font-size:16px;line-height:1}
.skill-state{font-size:11px;letter-spacing:.5px;opacity:.86;line-height:1.2}
#btns-bottom{position:absolute;bottom:18px;right:18px;display:flex;gap:10px}
.gbtn{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,224,165,.32);background:linear-gradient(180deg,rgba(61,34,20,.88),rgba(18,10,6,.86));color:#fff7e0;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);box-shadow:0 10px 20px rgba(0,0,0,.25);transition:transform .18s ease,box-shadow .18s ease,background .18s ease}
.gbtn:hover{transform:translateY(-2px);box-shadow:0 14px 24px rgba(0,0,0,.34)}
.gbtn:active{transform:translateY(0);background:linear-gradient(180deg,rgba(90,51,29,.95),rgba(26,14,8,.92))}

.screen{position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.screen.active{display:flex}
#scr-menu,#scr-levels,#scr-win,#scr-fail{overflow:hidden}
#scr-menu{background:linear-gradient(180deg,rgba(30,9,4,.34),rgba(8,3,2,.78)),radial-gradient(circle at 50% 16%,rgba(255,224,153,.24),transparent 30%),url('背景图.webp') center/cover no-repeat}
#scr-menu::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 18%,rgba(255,240,194,.18),transparent 22%),radial-gradient(circle at 84% 12%,rgba(255,187,94,.18),transparent 20%),linear-gradient(180deg,rgba(77,30,12,.18),rgba(10,4,3,.52))}
#scr-menu::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.04),transparent 14%,transparent 86%,rgba(255,255,255,.04)),linear-gradient(180deg,rgba(255,255,255,.02),transparent 18%,transparent 82%,rgba(0,0,0,.18));opacity:.46}
#scr-levels::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 10%,rgba(255,196,81,.08),transparent 28%),radial-gradient(circle at 80% 85%,rgba(216,71,51,.08),transparent 24%)}
#scr-rescue-select{background:radial-gradient(circle at 50% 18%,rgba(200,80,30,.18),transparent 30%),linear-gradient(180deg,#120804,#040201 100%)}
#scr-rescue-select::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 10%,rgba(255,160,60,.1),transparent 28%),radial-gradient(circle at 80% 85%,rgba(255,100,50,.08),transparent 24%)}
.menu-scene,.map-shell,.overlay-card,.result-card{position:relative;z-index:1;overflow:hidden;border-radius:30px;border:1px solid var(--line);backdrop-filter:blur(16px);box-shadow:0 28px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.menu-scene{width:min(920px,92vw);max-height:min(92vh,900px);overflow-y:auto;padding:50px 34px 56px;background:linear-gradient(180deg,rgba(69,27,12,.76),rgba(24,9,6,.86));text-align:center;border:2px solid rgba(255,229,172,.16)}
.menu-scene::before{content:'';position:absolute;inset:14px;border-radius:24px;border:1px solid rgba(255,240,207,.12);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 24%,rgba(0,0,0,.08) 100%);pointer-events:none}
.menu-scene::after{content:'';position:absolute;right:-26px;top:-20px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,218,112,.22) 0,rgba(255,218,112,0) 72%);pointer-events:none}
.menu-badge,.menu-ribbon,.hat-deco,.mtitle,.menu-en,.msub,.mode-actions,.mode-note{position:relative;z-index:1}

.menu-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:rgba(86,34,17,.54);border:1px solid rgba(255,226,170,.2);font-size:12px;letter-spacing:2px;color:#ffecbb;text-transform:uppercase;box-shadow:0 8px 18px rgba(0,0,0,.16)}
.menu-ribbon{display:inline-flex;align-items:center;justify-content:center;margin:18px auto 8px;padding:8px 18px;border-radius:999px;background:linear-gradient(180deg,rgba(255,214,131,.98),rgba(243,174,72,.94));color:#7f3514;font-size:13px;font-weight:900;letter-spacing:1px;box-shadow:0 10px 22px rgba(88,29,10,.18)}
.hat-deco{width:clamp(118px,18vw,172px);margin:18px auto 10px;filter:drop-shadow(0 12px 28px rgba(255,196,81,.18))}
.hat-deco img{display:block;width:100%;height:auto}
.mtitle{font-size:clamp(36px,7.2vw,66px);font-weight:900;color:#ffd15a;text-shadow:0 6px 24px rgba(0,0,0,.58),0 0 44px rgba(246,196,81,.22);letter-spacing:3px;line-height:1.06}
.menu-en{margin-top:10px;font-size:clamp(18px,3vw,29px);font-weight:900;letter-spacing:1.4px;color:#fff4d2;text-shadow:0 3px 10px rgba(0,0,0,.28)}
.msub{max-width:660px;margin:18px auto 0;padding:14px 22px;border-radius:24px;background:rgba(47,18,11,.28);border:1px solid rgba(255,227,175,.1);font-size:clamp(14px,2.6vw,20px);line-height:1.75;color:#ffe0a5;opacity:.98}
.mode-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:30px}
.mode-actions .hero-btn{margin:0}
.mode-note{margin-top:14px;font-size:13px;letter-spacing:.4px;color:rgba(255,238,206,.82)}

.mbtn{padding:14px 34px;font-size:18px;font-weight:900;border:none;border-radius:999px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;letter-spacing:1px}
.mbtn:hover{transform:translateY(-2px)}
.mbtn.p{background:linear-gradient(180deg,#ff8b65,#dc422d);color:#fff;border:1px solid rgba(255,238,216,.26);box-shadow:0 14px 30px rgba(216,71,51,.35)}
.mbtn.p:hover{box-shadow:0 18px 34px rgba(216,71,51,.42)}
.mbtn.s{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));color:#ffe3a3;border:1px solid rgba(255,224,165,.3)}
.hero-btn{padding:18px 42px;font-size:22px;min-width:240px;box-shadow:0 18px 40px rgba(235,83,52,.42)}
.hero-btn.alt{box-shadow:0 16px 34px rgba(0,0,0,.2)}

#scr-levels{background:radial-gradient(circle at 50% 18%,rgba(62,104,72,.24),transparent 28%),linear-gradient(180deg,#07100d,#020605 100%)}

.map-shell{width:min(1180px,94vw);max-height:90vh;overflow-y:auto;padding:30px;background:linear-gradient(180deg,rgba(9,31,24,.9),rgba(6,13,10,.92));-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,226,170,.2) transparent}
.map-head{position:relative;text-align:center;margin-bottom:20px;padding-top:4px}
.map-back{position:absolute;left:0;top:-4px;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,226,170,.12);border:1px solid rgba(255,240,207,.18);font-size:18px;color:#ffd15a;cursor:pointer;transition:background .2s ease;z-index:5}
.map-back:hover{background:rgba(255,226,170,.24)}
.map-back::before{content:'←';font-weight:bold;font-size:20px}
.lstitle{font-family:'Georgia','STKaiti','KaiTi','Noto Serif SC','Source Han Serif SC',serif;font-size:clamp(26px,4vw,38px);font-weight:700;letter-spacing:3px;color:var(--gold);text-shadow:0 4px 20px rgba(0,0,0,.45)}

.map-sub{margin-top:6px;font-family:'Georgia','STKaiti','KaiTi','Noto Serif SC','Source Han Serif SC',serif;color:#d3e0c4;font-size:13px;opacity:.86}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;width:100%}
.lcard{position:relative;min-height:230px;border-radius:24px;overflow:hidden;cursor:pointer;border:1px solid rgba(255,241,198,.12);background:#13231d;box-shadow:0 16px 30px rgba(0,0,0,.24);transition:transform .18s ease,box-shadow .18s ease,filter .18s ease}
.lcard:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 22px 34px rgba(0,0,0,.34)}
.lcard.no{cursor:not-allowed;filter:saturate(.35) brightness(.72)}
.lcard-art,.lcard-shade,.lmeta,.lbadge,.llock{position:absolute}
.lcard-art{inset:0;background-size:cover;background-position:center;transform:scale(1.02)}
.lcard-shade{inset:0;background:linear-gradient(180deg,rgba(6,12,10,.08),rgba(7,11,9,.22) 35%,rgba(5,9,8,.8) 100%)}
.lbadge{top:14px;left:14px;padding:6px 10px;border-radius:999px;background:rgba(8,16,13,.52);border:1px solid rgba(255,229,168,.16);font-size:11px;font-weight:800;letter-spacing:1px;color:#ffebbf;z-index:2}
.lmeta{left:0;right:0;bottom:0;padding:18px 16px 16px;z-index:2;background:linear-gradient(180deg,transparent,rgba(4,7,6,.35) 18%,rgba(4,7,6,.92) 100%)}
.ln{font-size:32px;font-weight:900;color:#fff3d4;line-height:1}
.ln2{margin-top:8px;font-size:18px;font-weight:900;color:#fff5d2;line-height:1.25}
.ln3{margin-top:4px;font-size:12px;letter-spacing:.6px;color:#d6e6d2;opacity:.82}
.llock{top:14px;right:14px;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:rgba(5,11,8,.62);border:1px solid rgba(255,241,198,.14);font-size:18px;z-index:2}
.bbk{margin:28px auto 0;padding:13px 32px;background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid rgba(255,233,181,.2);color:#f9e4b6;border-radius:999px;cursor:pointer;font-size:15px;font-weight:800;letter-spacing:1px}
#scr-win,#scr-fail,.pov{background:rgba(0,0,0,.76);backdrop-filter:blur(12px)}
.pov{position:absolute;top:0;left:0;width:100%;height:100%;z-index:90;display:none;align-items:center;justify-content:center}
.pov.on{display:flex}
.overlay-card,.result-card{width:min(480px,92vw);padding:34px 28px;background:linear-gradient(180deg,rgba(46,22,10,.92),rgba(14,7,5,.9));text-align:center}
.result-card.fail{background:linear-gradient(180deg,rgba(44,18,18,.92),rgba(14,7,7,.92))}
.pt{font-size:34px;color:var(--gold);font-weight:900;margin-bottom:10px;letter-spacing:2px}
.ri{font-size:78px;margin-bottom:12px}
.rt{font-size:34px;font-weight:900;margin-bottom:8px}
.rs{font-size:15px;line-height:1.75;margin-bottom:22px;opacity:.85}
.rstars{font-size:38px;margin-bottom:14px;letter-spacing:6px;color:#ffe08c}
.lho{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5;box-sizing:border-box;border:3px solid transparent;transition:border-color .4s}
.lho.on{border-color:rgba(255,70,45,.34);animation:plr 1s infinite}
@keyframes plr{0%,100%{border-color:rgba(255,70,45,.18)}50%{border-color:rgba(255,70,45,.42)}}
@media (max-width:720px){
  #health-bar{width:min(56vw,230px);top:calc(env(safe-area-inset-top, 0px) + 10px);left:calc(env(safe-area-inset-left, 0px) + 10px)}
  #energy-icon{width:30px;height:30px}
  #collect-counter{min-width:122px;padding:12px 14px 10px;font-size:18px;top:calc(env(safe-area-inset-top, 0px) + 10px);right:calc(env(safe-area-inset-right, 0px) + 10px)}
  #counterIcon{width:22px;height:22px}
  #skill-panel{left:calc(env(safe-area-inset-left, 0px) + 8px);right:calc(env(safe-area-inset-right, 0px) + 8px);bottom:calc(env(safe-area-inset-bottom, 0px) + 66px);transform:none;max-width:none;gap:6px}
  .skill-btn{min-width:calc(50% - 3px);padding:8px 8px}
  .menu-scene,.map-shell,.overlay-card,.result-card{padding:26px 18px}
  .menu-scene{padding:20px 16px 28px;max-height:96vh;width:min(100vw,92vw);border-radius:18px}
  .hat-deco{width:clamp(72px,14vw,110px);margin:8px auto 6px}
  .mtitle{font-size:clamp(24px,6vw,44px)}
  .menu-en{font-size:clamp(12px,2.5vw,20px);margin-top:6px}
  .msub{margin:10px auto 0;padding:10px 14px;font-size:clamp(12px,2.2vw,15px);line-height:1.6}
  .mode-actions{margin-top:16px;gap:10px}
  .hero-btn{padding:13px 28px;font-size:17px;min-width:0}
  .mode-actions{flex-direction:column;align-items:center}
  .mode-actions .hero-btn{width:min(100%,280px)}
  .map-head{padding-top:54px}
  .map-back{left:0;top:-4px;transform:none;width:38px;height:38px;font-size:16px}
  .map-back::before{font-size:18px}
  .lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lcard{min-height:150px}
  .lcard-art{background-size:cover}
  .ln{font-size:26px}
  .ln2{font-size:14px}
  .ln3{font-size:11px}
  .lbadge{font-size:10px;padding:4px 8px}
  .overlay-card,.result-card{width:min(98vw,92vw);padding:28px 18px;border-radius:20px}
  .map-shell{width:min(100vw,98vw);padding:18px 12px;border-radius:18px}
  #btns-bottom{bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);right:calc(env(safe-area-inset-right, 0px) + 10px);gap:8px}
  .gbtn{width:44px;height:44px;font-size:16px}
  .menu-ribbon{font-size:11px;padding:6px 14px}
  .menu-badge{font-size:11px;padding:6px 12px}
  .mbtn{padding:12px 24px;font-size:16px}
}
@media (max-width:480px){
  .menu-scene{padding:16px 12px 22px;border-radius:14px}
  .mtitle{font-size:clamp(20px,7vw,38px);letter-spacing:1px}
  .msub{font-size:12px;line-height:1.5;padding:8px 10px}
  .hero-btn{padding:12px 20px;font-size:15px;width:100%}
  .mode-actions{gap:8px}
  #health-bar{top:calc(env(safe-area-inset-top, 0px) + 6px);left:calc(env(safe-area-inset-left, 0px) + 6px);height:44px;padding:10px 8px 6px 40px}
  #energy-icon{width:24px;height:24px;left:8px;top:10px}
  #energy-text{font-size:14px}
  #collect-counter{top:calc(env(safe-area-inset-top, 0px) + 6px);right:calc(env(safe-area-inset-right, 0px) + 6px);height:44px;font-size:15px;min-width:90px;padding:8px 10px 6px}
  #counterIcon{width:18px;height:18px}
  #skill-panel{bottom:calc(env(safe-area-inset-bottom, 0px) + 56px);gap:5px}
  .skill-btn{min-width:calc(50% - 3px);padding:7px 6px}
  .skill-name{font-size:12px}
  .skill-state{font-size:9px}
  #btns-bottom{bottom:calc(env(safe-area-inset-bottom, 0px) + 8px);right:calc(env(safe-area-inset-right, 0px) + 6px)}
  .gbtn{width:40px;height:40px;font-size:14px}
  .lgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .lcard{min-height:120px}
  .ln{font-size:20px}
}



/* === 入场玩法说明浮层 === */
#mode-tutorial{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  max-width:min(500px,88vw);width:auto;
  background:rgba(10,6,3,0.72);
  border:1px solid rgba(255,220,140,.28);
  border-radius:22px;
  padding:26px 32px;
  text-align:center;
  color:#fff;
  font-size:clamp(14px,2.2vw,18px);
  line-height:1.8;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.6s ease;
  z-index:200;
  backdrop-filter:blur(8px);
  box-shadow:0 16px 48px rgba(0,0,0,.5);
}
#mode-tutorial.show{opacity:0.6;}
#mode-tutorial .tut-title{
  font-size:clamp(16px,2.8vw,22px);
  font-weight:900;
  color:#ffd15a;
  margin-bottom:10px;
  letter-spacing:1px;
}

</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div class="lho" id="lho"></div>
<div id="ui-layer">
  <div id="health-bar" data-label="体力">
    <img id="energy-icon" src="鸡腿.webp" alt="鸡腿体力">
    <div id="energy-fill"></div>
    <span id="energy-text">100</span>
  </div>
  <div id="collect-counter"><span id="counterLabel">鸡腿</span><img id="counterIcon" src="鸡腿.webp" alt="鸡腿计数"><span id="cTxt">0/5</span></div>
  <canvas id="miniMapCanvas" width="90" height="126"></canvas>
  <div id="skill-panel">
    <button class="skill-btn" data-skill="skill1"><span class="skill-name">一技能</span><span class="skill-state">需 1 鸡腿</span></button>
    <button class="skill-btn" data-skill="skill2"><span class="skill-name">二技能</span><span class="skill-state">需 1 鸡腿</span></button>
    <button class="skill-btn" data-skill="skill3"><span class="skill-name">三技能</span><span class="skill-state">需 2 鸡腿</span></button>
    <button class="skill-btn" data-skill="skill4"><span class="skill-name">四技能</span><span class="skill-state">需 3 鸡腿</span></button>
  </div>
  <div id="btns-bottom">
    <button class="gbtn" id="bHome" title="返回主界面">⌂</button>
    <button class="gbtn" id="bRst" title="重新开始">↺</button>
    <button class="gbtn" id="bPau" title="暂停">⏸</button>
  </div>
  <!-- 入场玩法说明浮层 -->
  <div id="mode-tutorial"></div>
</div><!-- /ui-layer -->
<div class="pov" id="pov">

function ensureAudio(){if(!audioCtx)audioCtx=new AudioCtx()}
function playTone(freq,dur,type,vol){
  ensureAudio();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.12,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}

function buildDrumstickScoreMask(data,w,h){
  const seed=new Uint8Array(w*h);
  for(let i=0;i<seed.length;i++){
    const o=i*4;
    const a=data[o+3];
    if(a<110)continue;
    const r=data[o],g=data[o+1],b=data[o+2];
    const max=Math.max(r,g,b),min=Math.min(r,g,b);
    const lum=(r+g+b)/3;
    if(lum<26&&max-min<18)continue;
    seed[i]=1;
  }
  const seen=new Uint8Array(w*h);
  const queue=new Int32Array(w*h);
  let best=null,bestCount=0;
  for(let i=0;i<seed.length;i++){
    if(!seed[i]||seen[i])continue;
    let head=0,tail=0;
    const comp=[];
    queue[tail++]=i;
    seen[i]=1;
    while(head<tail){
      const cur=queue[head++];
      comp.push(cur);
      const x=cur%w,y=(cur/w)|0;
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        if(!ox&&!oy)continue;
        const nx=x+ox,ny=y+oy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        const ni=ny*w+nx;
        if(!seed[ni]||seen[ni])continue;
        seen[ni]=1;
        queue[tail++]=ni;
      }
    }
    if(comp.length>bestCount){
      best=comp;
      bestCount=comp.length;
    }
  }
  const mask=new Uint8Array(w*h);
  if(best)for(const idx of best)mask[idx]=1;
  return mask;
}
function preloadDrumstickAsset(){

}
function normalizeModelMessages(input,systemPrompt=''){
  const base=Array.isArray(input)?input.filter(msg=>msg&&msg.role&&msg.content!=null):[{role:'user',content:String(input??'')}];
  if(systemPrompt){
    if(!base.length||base[0].role!=='system')base.unshift({role:'system',content:String(systemPrompt)});
  }
  return base.map(msg=>({role:msg.role,content:msg.content}));
}
async function requestModel(input,options={}){
  const payload={
    messages:normalizeModelMessages(input,options.systemPrompt||''),
    temperature:options.temperature??.7,
    max_tokens:options.maxTokens??600,
  };
  if(options.model)payload.model=options.model;
  if(options.top_p!=null)payload.top_p=options.top_p;
  const res=await fetch(MODEL_PROXY_CHAT_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  const data=await res.json().catch(()=>({ok:false,error:'模型代理返回了非 JSON 数据'}));
  if(!res.ok||data.ok===false)throw new Error(data.error||`模型请求失败(${res.status})`);
  return data;
}

  return data;
}

function init(){
  G.cv=document.getElementById('gameCanvas');
  G.cx=G.cv.getContext('2d',{alpha:false});
  preloadDrumstickAsset();
  preloadPlayerImage();
  onResize();
  window.addEventListener('resize',queueResize,{passive:true});
  setupInput();
  setupUI();
  applyHudMode();
  showScr('menu');
  requestAnimationFrame(loop);
}
function onResize(){
  G.W=window.innerWidth;G.H=window.innerHeight;
  G.cv.width=G.W;G.cv.height=G.H;
  // resize时重置相机偏移，让updateCam重新计算
  if(G.scr==='play'&&G.mW>0&&G.mH>0){
    G.cx_=0;G.cy_=0;
  }
}
let resizeFrame=0;
function queueResize(){
  if(resizeFrame)return;
  resizeFrame=requestAnimationFrame(()=>{
    resizeFrame=0;
    onResize();
  });
}

// === SCREENS ===
function showScr(s){
  G.scr=s;
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));
  document.getElementById('ui-layer').style.display='none';
  document.getElementById('pov').classList.remove('on');
  if(s==='menu')document.getElementById('scr-menu').classList.add('active');
  else if(s==='levels'){buildGrid();document.getElementById('scr-levels').classList.add('active')}
  else if(s==='rescue-select'){buildRescueGrid();document.getElementById('scr-rescue-select').classList.add('active')}
  else if(s==='play'){document.getElementById('ui-layer').style.display='block'}
  else if(s==='pause'){document.getElementById('ui-layer').style.display='block';document.getElementById('pov').classList.add('on')}
  else if(s==='win'){buildWin();document.getElementById('scr-win').classList.add('active')}
  else if(s==='fail'){updateFailScreen();document.getElementById('scr-fail').classList.add('active')}
}

const CARD_ART_EAGER_COUNT=4;
let cardArtObserver=null;
function loadCardArtwork(art){
  const src=art.dataset.bg;
  if(!src)return;
  art.style.backgroundImage=`url('${src}')`;
  delete art.dataset.bg;
  if(cardArtObserver)cardArtObserver.unobserve(art);
}
function queueCardArtwork(art,index){
  if(index<CARD_ART_EAGER_COUNT||!('IntersectionObserver' in window)){
    loadCardArtwork(art);
    return;
  }
  if(!cardArtObserver){
    cardArtObserver=new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        if(entry.isIntersecting)loadCardArtwork(entry.target);
      });
    },{rootMargin:'320px 0px'});
  }
  cardArtObserver.observe(art);
}
function resetCardArtworkQueue(){
  if(cardArtObserver)cardArtObserver.disconnect();
  cardArtObserver=null;
}
function buildGrid(){
  resetCardArtworkQueue();
  const g=document.getElementById('lGrid');g.innerHTML='';
  LVLS.forEach((l,i)=>{
    const c=document.createElement('div');
    const tabPath=encodeURI(getLevelTabImagePath(l));
    c.className='lcard ok';
    c.innerHTML=`<div class="lcard-art" data-bg="${tabPath}"></div><div class="lcard-shade"></div><div class="lbadge">已解锁</div><div class="lmeta"><div class="ln">${String(i+1).padStart(2,'0')}</div></div>`;
    c.addEventListener('pointerdown',()=>preloadLevelImage(i),{once:true,passive:true});
    c.onclick=()=>startLvl(i);
    g.appendChild(c);
    queueCardArtwork(c.querySelector('.lcard-art'),i);
  });
}

    const shots=G.rescue.usedShots;

    document.getElementById('wSu').textContent=su;
    nextBtn.textContent='下一关';
    menuBtn.textContent='返回主页';
    return;
  }
  if(G.mode===GAME_MODES.RUSH){

    const totalKills=G.rush?G.rush.totalKills:0;
    let gr='壮烈牺牲',su=`你在无限模式中坚持到了第${wave}波，共击败${totalKills}个敌人！`,ico='⚔️';

    document.getElementById('wSu').textContent=su;
    nextBtn.textContent='再闯一轮';

}


// === HEALTH UI (Energy Bar) ===
function updHP(){
  const bar=document.getElementById('health-bar');
  const fill=document.getElementById('energy-fill');
  const txt=document.getElementById('energy-text');
  if(G.mode===GAME_MODES.RESCUE&&G.rescue){
    const used=G.rescue.usedShots;
    const max=G.rescue.maxShots;
    const pct=max?Math.max(0,(max-used))/max:0;
    bar.dataset.label='弹射';
    fill.style.width=(pct*100)+'%';
    fill.style.background=pct>.4?'linear-gradient(90deg,#6fe7ff,#4f7cff)':'linear-gradient(90deg,#ffb347,#ff6b5c)';
    txt.textContent=(max-used)+'/'+max;
    document.getElementById('lho').classList.remove('on');
    return;
  }
  if(G.mode===GAME_MODES.RUSH&&G.rush){
    const legs=G.rush.legs||0;
    const pct=Math.min(1,legs/RUSH_LEG_UI_MAX);
    bar.dataset.label='鸡腿';
    fill.style.width=(pct*100)+'%';
    fill.style.background='linear-gradient(90deg,#ffd56b,#ff9728)';
    txt.textContent=legs;
    document.getElementById('lho').classList.remove('on');
    return;
  }
  const pct=G.maxHP?G.hp/G.maxHP:0;
  bar.dataset.label='体力';
  fill.style.width=(pct*100)+'%';
  let color;
  if(pct>.6) color='linear-gradient(90deg,#2ecc71,#27ae60)';
  else if(pct>.35) color='linear-gradient(90deg,#f39c12,#e67e22)';
  else if(pct>.2) color='linear-gradient(90deg,#e67e22,#d35400)';
  else color='linear-gradient(90deg,#e74c3c,#c0392b)';
  fill.style.background=color;
  txt.textContent=Math.ceil(G.hp);
  document.getElementById('lho').classList.toggle('on',G.hp<=20&&G.hp>0);
}

// 13个关卡，每个关卡有独立背景图；石头平台随机生成；3个鸡腿在上半部分
// 玩家有12次弹射 + 3次放屁跳跃
const RESCUE_LEVEL_NAMES=[
  '1_风车村','2_橘子镇','3_磁鼓岛','4_阿拉巴斯坦','5_空岛',
  '6_七水之都','7_司法岛','8_恐怖三诡帆船','9_香波地群岛','10_鱼人岛',
  '11_德雷斯罗萨','12_蛋糕岛','13_和之国'
];
const RESCUE_STONE_NAMES=[
  '黄色短石','黄色中石','黄色长石',
  '灰色短石','灰色中石','灰色长石',
  '紫色短石','紫色中石','紫色长石'
];
// 石头尺寸映射（宽×高）
const RESCUE_STONE_SIZES={
  '黄色短石':{w:80,h:20},'黄色中石':{w:120,h:20},'黄色长石':{w:180,h:20},
  '灰色短石':{w:80,h:22},'灰色中石':{w:130,h:22},'灰色长石':{w:190,h:22},
  '紫色短石':{w:85,h:24},'紫色中石':{w:135,h:24},'紫色长石':{w:200,h:24},
};
const RESCUE_MAX_SHOTS_NEW=12,RESCUE_FART_MAX=3;
const rescueBgImages={};
const rescueStoneImages={};
// 预处理过的石头离屏Canvas缓存（key: "stoneName_w_h"）
const rescueStoneCacheMap={};

function getStoneCache(stImg,name,w,h){
  const key=`${name}_${w}_${h}`;
  if(rescueStoneCacheMap[key])return rescueStoneCacheMap[key];
  // 创建离屏Canvas，一次性渲染加了滤镜+阴影的石头图片
  const oc=document.createElement('canvas');
  // 留出阴影空间
  const pad=12;
  oc.width=w+pad*2;oc.height=h+pad*2;
  const ox=oc.getContext('2d');
  ox.filter='saturate(1.6) brightness(1.15) contrast(1.05)';
  ox.shadowColor='rgba(0,0,0,0.55)';ox.shadowBlur=8;ox.shadowOffsetX=2;ox.shadowOffsetY=4;
  ox.drawImage(stImg,pad,pad,w,h);
  ox.filter='none';ox.shadowColor='transparent';ox.shadowBlur=0;
  // 顶部高光
  ox.fillStyle='rgba(255,255,255,0.18)';ox.fillRect(pad+3,pad+1,w-6,2);
  rescueStoneCacheMap[key]=oc;
  return oc;
}

let rescueStoneImagesPreloaded=false;
function preloadRescueImages(name){
  if(!rescueBgImages[name]){
    const img=new Image();
    img.decoding='async';
    img.src=`${name}.webp`;
    rescueBgImages[name]=img;
  }
  if(rescueStoneImagesPreloaded)return;
  rescueStoneImagesPreloaded=true;
  for(const name of RESCUE_STONE_NAMES){
    const img=new Image();
    img.decoding='async';
    img.src=`${name}.webp`;
    rescueStoneImages[name]=img;
    // 图片加载完成后立即生成各尺寸缓存
    img.onload=()=>{
      const sizes=RESCUE_STONE_SIZES;
      for(const sname of RESCUE_STONE_NAMES){
        if(rescueStoneImages[sname]===img&&sizes[sname]){
          const {w,h}=sizes[sname];
          getStoneCache(img,sname,w,h);
        }
      }
    };
  }
}

// 生成随机种子（基于关卡索引确定随机序列，可重现）
function rescueLevelRng(lvlIdx,seed){
  // 简单线性同余随机
  let s=(lvlIdx*2654435761+seed*1000003)>>>0;
  return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296;};
}

function buildRescueLevel(){
  const lvlIdx=G.rescueLvl||0; // 当前营救关卡索引 0-12
  const MAP_W=500,MAP_H=1400;
  G.mW=MAP_W;G.mH=MAP_H;
  G.walls=createWallBounds();
  G.windmills=[];G.barrels=[];G.rush=null;

  const rng=rescueLevelRng(lvlIdx,42);

  // 生成石头平台（至少9个，随机数量9~13个）
  const platCount=9+Math.floor(rng()*5); // 9~13
  const platforms=[];
  // 地面平台（固定）
  platforms.push({x:MAP_W/2,y:MAP_H-20,w:MAP_W-20,h:24,stoneName:'灰色长石',isGround:true});

  // 将地图高度分成若干层，每层放1~2个平台
  // 下半部分：y从 MAP_H-80 到 MAP_H/2（较密集，供站立起跳）
  // 上半部分：y从 0 到 MAP_H/2（鸡腿区域，稀疏）
  const layerCount=platCount;
  const totalHeight=MAP_H-80; // 可分布高度
  const layerH=totalHeight/layerCount;
  const allStones=RESCUE_STONE_NAMES.slice();

  for(let i=0;i<layerCount;i++){
    const yBase=MAP_H-80-(i+1)*layerH;
    const yPos=yBase+rng()*layerH*0.5;
    const yFinal=Math.max(60,Math.min(MAP_H-120,yPos));
    const stoneName=allStones[Math.floor(rng()*allStones.length)];
    const sz=RESCUE_STONE_SIZES[stoneName];
    // 横向随机，留边距
    const xPos=sz.w/2+20+rng()*(MAP_W-sz.w-40);
    platforms.push({x:xPos,y:yFinal,w:sz.w,h:sz.h,stoneName,isGround:false});
  }

  // 3个鸡腿放在上半部分（y < MAP_H*0.45）
  const targets=[];
  const usedX=[];
  for(let i=0;i<3;i++){
    let tx,ty,tries=0;
    do{
      tx=50+rng()*(MAP_W-100);
      ty=40+rng()*(MAP_H*0.38);
      tries++;
    }while(tries<50&&usedX.some(ux=>Math.abs(ux-tx)<60));
    usedX.push(tx);
    targets.push({x:tx,y:ty});
  }

  // 构建 G.blds（平台）
  G.blds=platforms.map(p=>({
    x:p.x,y:p.y,w:p.w,h:p.h,
    poly:null,edible:false,type:p.isGround?'ground':'stone',alive:true,
    isPlatform:true,stoneName:p.stoneName||'灰色中石',
  }));

  // 鸡腿目标
  G.colls=targets.map(t=>({x:t.x,y:t.y,r:COLLECT_R,got:false,isRescueTarget:true}));
  G.totCol=G.colls.length;
  G.col=0;

  G.rescue={
    maxShots:RESCUE_MAX_SHOTS_NEW,
    usedShots:0,
    parShots:6,
    fartLeft:RESCUE_FART_MAX,
    fartMax:RESCUE_FART_MAX,
    lvlIdx,
    bgName:RESCUE_LEVEL_NAMES[lvlIdx%RESCUE_LEVEL_NAMES.length],
    onPlatform:null,
    highestY:MAP_H-80,
    landedOnPlatform:false,
    sliding:false,
    switches:[],
    gates:[],
    endQueued:false,
    failQueued:false,
  };

  // 地面平台 y=MAP_H-20，顶部=MAP_H-20-12=MAP_H-32，玩家底部=ly+lr
  // 起始 ly = MAP_H-32-lr = MAP_H-32-17 = MAP_H-49
  const startPos={x:MAP_W/2,y:MAP_H-49};
  resetRunState(startPos,RESCUE_MAX_SHOTS_NEW);
  G.hp=RESCUE_MAX_SHOTS_NEW;
  G.maxHP=RESCUE_MAX_SHOTS_NEW;

// 重力下落时的平台着陆检测（宽松版）
function checkRescuePlatformLanding(){
  if(!G.rescue||!G.fly)return;
  // 下落时检测（vy>=0即可，不需要很快）
  if(G.lvy<0)return;
  for(const b of G.blds){
    if(!b.alive||!b.isPlatform)continue;
    const platTop=b.y-b.h/2;
    const platLeft=b.x-b.w/2;
    const platRight=b.x+b.w/2;
    const ballBottom=G.ly+G.lr;
    // 宽松的着陆判定：
    // 1. 球底部在平台顶面附近（±6像素容差）
    // 2. 球水平位置在平台范围内（含半径容差）
    // 3. 球在向下或水平移动
    if(ballBottom>=platTop-6&&ballBottom<=platTop+b.h*0.5&&
       G.lx>platLeft-G.lr*0.5&&G.lx<platRight+G.lr*0.5&&G.lvy>=0){
      // 着陆！进入滑行状态而非瞬停
      G.ly=platTop-G.lr;
      G.lvy=0;
      G.rescue.onPlatform=b;
      G.rescue.landedOnPlatform=true;
      G.rescue.sliding=true; // 标记滑行中
      if(G.ly<G.rescue.highestY)G.rescue.highestY=G.ly;
      return;
    }
  }
}

// === 通用关卡构建函数 ===
function isCircleBlocked(x,y,r,obstacles,padding=0){
  const rr=r+padding;
  return obstacles.some(o=>!!hitObstacle(o,x,y,rr));
}
function isReservedSpot(x,y,reserved,defaultMinDist=0){
  return reserved.some(p=>Math.hypot(p.x-x,p.y-y)<(p.minDist??defaultMinDist));
}
function findSafeSpot(targetX,targetY,r,obstacles,margin=24,reserved=[],options={}){
  const {padding=6,returnNull=false}=options;
  const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
  const minX=margin+r,maxX=G.mW-margin-r;
  const minY=margin+r,maxY=G.mH-margin-r;
  const startX=clamp(targetX,minX,maxX),startY=clamp(targetY,minY,maxY);
  const isValid=(x,y)=>!isCircleBlocked(x,y,r,obstacles,padding)&&!isReservedSpot(x,y,reserved);
  if(isValid(startX,startY))return{x:startX,y:startY};
  const step=18;
  const rings=Math.ceil(Math.max(G.mW,G.mH)/step);
  for(let ring=1;ring<=rings;ring++){
    const radius=ring*step;
    const samples=Math.max(16,ring*8);
    for(let i=0;i<samples;i++){
      const angle=(Math.PI*2*i)/samples;
      const x=clamp(startX+Math.cos(angle)*radius,minX,maxX);
      const y=clamp(startY+Math.sin(angle)*radius,minY,maxY);
      if(isValid(x,y))return{x,y};
    }
  }
  return returnNull?null:{x:startX,y:startY};
}
function hasCollectibleApproach(x,y,obstacles,margin=24){
  const approachDist=Math.max(G.lr+COLLECT_R-8,24);
  const minX=margin+G.lr,maxX=G.mW-margin-G.lr;
  const minY=margin+G.lr,maxY=G.mH-margin-G.lr;
  for(let i=0;i<16;i++){
    const angle=(Math.PI*2*i)/16;
    const px=x+Math.cos(angle)*approachDist;
    const py=y+Math.sin(angle)*approachDist;
    if(px<minX||px>maxX||py<minY||py>maxY)continue;
    if(!isCircleBlocked(px,py,G.lr,obstacles,4))return true;
  }
  return false;
}
function buildPlayableCollectibles(obstacles,startPos){
  const targets=[
    [0.18,0.2],[0.82,0.2],[0.2,0.48],[0.8,0.48],
    [0.5,0.3],[0.5,0.62],[0.32,0.74],[0.68,0.74],
    [0.34,0.22],[0.66,0.22],[0.3,0.58],[0.7,0.58],[0.5,0.46],
  ];
  const reserved=[{x:startPos.x,y:startPos.y,minDist:COLLECT_R*3.4}];
  const collectibles=[];
  const spawnRadius=COLLECT_R+5;
  const collectMinDist=COLLECT_R*2.8;
  const tryAddCollectible=(targetX,targetY)=>{
    if(collectibles.length>=5)return true;
    const spot=findSafeSpot(targetX,targetY,spawnRadius,obstacles,28,reserved,{padding:4,returnNull:true});
    if(!spot||isReservedSpot(spot.x,spot.y,reserved,collectMinDist)||!hasCollectibleApproach(spot.x,spot.y,obstacles))return false;
    collectibles.push({x:spot.x,y:spot.y,r:COLLECT_R,got:false});
    reserved.push({x:spot.x,y:spot.y,minDist:collectMinDist});
    return true;
  };
  for(const [rx,ry] of targets){
    if(collectibles.length>=5)break;
    tryAddCollectible(G.mW*rx,G.mH*ry);
  }
  if(collectibles.length<5){
    const passes=[[0,0],[0.03,0.03],[0.03,0],[0,0.03]];
    for(const [offX,offY] of passes){
      for(let gy=0.14+offY;gy<=0.86&&collectibles.length<5;gy+=0.06){
        for(let gx=0.14+offX;gx<=0.86&&collectibles.length<5;gx+=0.06){
          tryAddCollectible(G.mW*gx,G.mH*gy);
        }
      }
      if(collectibles.length>=5)break;
    }
  }
  return collectibles.filter(c=>!isCircleBlocked(c.x,c.y,spawnRadius,obstacles,4)&&hasCollectibleApproach(c.x,c.y,obstacles));
}

function refreshRushWalls(){
  if(!G.rush)return;
  const outer=10;
  const walls=[];
  // 十字地图边界墙（整体地图）
  walls.push({x:G.mW/2,y:outer/2,w:G.mW,h:outer});
  walls.push({x:G.mW/2,y:G.mH-outer/2,w:G.mW,h:outer});
  walls.push({x:outer/2,y:G.mH/2,w:outer,h:G.mH});
  walls.push({x:G.mW-outer/2,y:G.mH/2,w:outer,h:G.mH});
  // 十字地图：左上、右上、左下、右下角落（非十字区域）用墙填充
  const C=RUSH_CELL_SIZE;
  // 角落墙（col=0,row=0; col=2,row=0; col=0,row=2; col=2,row=2）
  const corners=[[0,0],[2,0],[0,2],[2,2]];
  for(const [col,row] of corners){
    walls.push({x:col*C+C/2,y:row*C+C/2,w:C,h:C});
  }
  // 十字区域之间的门（4条通道）
  // center<->top:  x=1*C..2*C, y=1*C 处的水平墙，中间开口
  // center<->right: x=2*C 处竖向墙，中间开口
  // center<->bottom: x=1*C..2*C, y=2*C 处水平墙，中间开口
  // center<->left: x=1*C 处竖向墙，中间开口
  const doorW=RUSH_DOOR_WIDTH;
  const doorT=RUSH_DOOR_THICKNESS;
  if(G.rush.doors){
    for(const door of G.rush.doors){
      if(door.open){
        // 门开放：只在两侧留小段实体墙，中间开口（原逻辑）
        if(door.axis==='h'){
          const wallLeftW=door.cx-doorW/2-door.left;
          const wallRightW=door.right-(door.cx+doorW/2);
          if(wallLeftW>0)walls.push({x:door.left+wallLeftW/2,y:door.y,w:wallLeftW,h:doorT});
          if(wallRightW>0)walls.push({x:door.cx+doorW/2+wallRightW/2,y:door.y,w:wallRightW,h:doorT});
        } else {
          const wallTopH=door.cy-doorW/2-door.top;
          const wallBotH=door.bottom-(door.cy+doorW/2);
          if(wallTopH>0)walls.push({x:door.x,y:door.top+wallTopH/2,w:doorT,h:wallTopH});
          if(wallBotH>0)walls.push({x:door.x,y:door.cy+doorW/2+wallBotH/2,w:doorT,h:wallBotH});
        }
      } else {
        // 门关闭：整条通道全部封闭，无开口
        if(door.axis==='h'){
          const fullW=door.right-door.left;
          walls.push({x:door.left+fullW/2,y:door.y,w:fullW,h:doorT});
        } else {
          const fullH=door.bottom-door.top;
          walls.push({x:door.x,y:door.top+fullH/2,w:doorT,h:fullH});
        }
      }
    }
  }
  G.walls=walls;
}

  const b=getCellBounds(cellId);
  for(let tries=0;tries<50;tries++){
    const x=randBetween(b.minX+COLLECT_R,b.maxX-COLLECT_R);
    const y=randBetween(b.minY+COLLECT_R,b.maxY-COLLECT_R);
    if(isReservedSpot(x,y,reserved,COLLECT_R*3))continue;
    reserved.push({x,y,minDist:COLLECT_R*3});
    return{x,y,r:COLLECT_R,got:false,legs:1};
  }
  return null;
}

// 无限模式：生成一波敌人
function spawnWaveEnemies(count){
  if(!G.rush)return;
  // 清理已死亡的敌人，避免数组膨胀
  G.rush.enemies=G.rush.enemies.filter(e=>e.alive);
  const reserved=[];
  // 保留玩家位置
  reserved.push({x:G.lx||getCellBounds('center').cx,y:G.ly||getCellBounds('center').cy,minDist:120});
  // 保留已有敌人位置
  for(const e of G.rush.enemies){
    if(e.alive)reserved.push({x:e.x,y:e.y,minDist:e.r*2.4});
  }
  // 可用的敌人类型池，根据波次递增
  const allTypes=['soldier1','soldier2','vice1','vice2','vice3','admiral1','admiral2','admiral3'];
  const wave=G.rush.wave;
  let typePool;
  if(wave<=1) typePool=['soldier1','soldier2','soldier1','soldier2','vice1'];
  else if(wave<=2) typePool=['soldier1','soldier2','vice1','vice2','vice3'];
  else if(wave<=3) typePool=['soldier1','soldier2','vice1','vice2','vice3','admiral1'];
  else if(wave<=4) typePool=['soldier1','soldier2','vice1','vice2','vice3','admiral1','admiral2'];
  else typePool=allTypes;

  // 将敌人随机分配到5个cell中
  const cellIds=CROSS_CELLS.map(c=>c.id);
  let spawned=0;
  for(let i=0;i<count;i++){
    const cellId=cellIds[i%cellIds.length];
    const typeKey=typePool[Math.floor(Math.random()*typePool.length)];
    const e=spawnEnemyInCell(cellId,typeKey,reserved);
    if(e){
      G.rush.enemies.push(e);
      reserved.push({x:e.x,y:e.y,minDist:e.r*2.4});
      spawned++;
    }
  }
  return spawned;
}

// 无限模式：生成一波鸡腿
function spawnWavePickups(){
  if(!G.rush)return;
  // 清理已收集的鸡腿
  G.colls=G.colls.filter(c=>!c.got);
  const reserved=[];
  for(const e of G.rush.enemies){
    if(e.alive)reserved.push({x:e.x,y:e.y,minDist:e.r*2.4});
  }
  for(const c of G.colls){
    reserved.push({x:c.x,y:c.y,minDist:COLLECT_R*3});
  }
  // 每波在每个cell放4个鸡腿
  for(const cell of CROSS_CELLS){
    for(let i=0;i<4;i++){
      const p=spawnRushPickupInCell(cell.id,reserved);
      if(p){
        const a=Math.random()*Math.PI*2;
        const spd=0.4+Math.random()*0.5;
        p.vx=Math.cos(a)*spd;p.vy=Math.sin(a)*spd;
        p.turnT=60+Math.random()*120|0;
        p.cellId=cell.id;
        G.colls.push(p);
        reserved.push({x:p.x,y:p.y,minDist:COLLECT_R*3});
      }
    }
  }
}
function activateRushSkill(id){
  if(G.mode!==GAME_MODES.RUSH||!G.rush)return;
  const skill=RUSH_SKILLS[id],state=G.rush.skills[id];
  if(!skill||!state||state.active>0||(G.rush.activeSkill&&G.rush.activeSkill!==id))return;
  if(G.rush.legs<skill.cost)return;
  G.rush.legs-=skill.cost;
  G.rush.legsSpent+=skill.cost;
  G.rush.activeSkill=id;
  state.active=skill.duration;
  syncRushPlayerState();
  updHP();
  updateRushSkillButtons();
  G.txts.push({x:G.lx,y:G.ly-G.lr-18,t:`${skill.label}: ${skill.desc}`,l:50,ml:50,c:'#fff0b1'});
  sfxCollect();
  // 四技能重置壁弹计数
  if(id==='skill4')G.wallBoostCount=0;
}
function updateRushSkillButtons(){
  const panel=document.getElementById('skill-panel');
  if(!panel)return;
  panel.style.display=G.mode===GAME_MODES.RUSH?'flex':'none';
  panel.querySelectorAll('.skill-btn').forEach(btn=>{
    const id=btn.dataset.skill;
    const skill=RUSH_SKILLS[id];
    const state=G.rush&&G.rush.skills?G.rush.skills[id]:null;
    const label=btn.querySelector('.skill-state');
    const nameEl=btn.querySelector('.skill-name');
    const locked=G.mode!==GAME_MODES.RUSH||!skill||!state||!G.rush;
    const active=!!(G.rush&&G.rush.activeSkill===id&&state&&state.active>0);
    const blocked=!!(G.rush&&G.rush.activeSkill&&G.rush.activeSkill!==id&&G.rush.skills[G.rush.activeSkill]?.active>0);
    const canUse=!!(G.rush&&G.rush.legs>=skill.cost);
    btn.disabled=locked||blocked||(!active&&!canUse);
    btn.classList.toggle('active',active);
    if(nameEl)nameEl.textContent=skill.label;
    if(locked)label.textContent=`需 ${skill?skill.cost:0} 鸡腿`;
    else if(active)label.textContent=`${skill.desc} ${Math.ceil(state.active/60)}s`;
    else if(canUse)label.textContent=`消耗 ${skill.cost} 鸡腿`;
    else label.textContent=`需 ${skill.cost} 鸡腿`;
  });
}
function updateRushSkills(){
  if(G.mode!==GAME_MODES.RUSH||!G.rush)return;
  let changed=false;
  for(const [key,state] of Object.entries(G.rush.skills)){
    if(state.active>0){
      state.active--;
      if(state.active<=0&&G.rush.activeSkill===key){
        G.rush.activeSkill=null;
        changed=true;
        G.txts.push({x:G.lx,y:G.ly-G.lr-14,t:`${RUSH_SKILLS[key].label}结束`,l:36,ml:36,c:'#e9f2ff'});
      }
    }
  }
  if(changed){
    syncRushPlayerState();
    updateRushSkillButtons();
  }else if(G.gt%6===0)updateRushSkillButtons();
}

function updateRushStageProgress(){
  if(!G.rush)return;
  // 无限模式：检查当前波次是否全部击杀
  const aliveCount=countAliveAllEnemies();
  if(aliveCount===0&&!G.rush.endQueued&&!G.rush.failQueued){
    // 当前波次清空，进入下一波
    G.rush.wave++;
    const nextCount=10+G.rush.wave*10; // 第2波30,第3波40,第4波50...
    G.rush.waveEnemies=nextCount;
    G.rush.waveKills=0;
    G.totCol+=nextCount;
    updCol();
    // 重置cell清空状态
    for(const cell of CROSS_CELLS)G.rush.cellCleared[cell.id]=false;
    // 生成下一波敌人
    spawnWaveEnemies(nextCount);
    // 刷新鸡腿
    spawnWavePickups();
    // 提示
    G.txts.push({x:G.lx,y:G.ly-G.lr-40,t:`🌊 第${G.rush.wave}波! ${nextCount}个敌人来袭!`,l:70,ml:70,c:'#ffd700'});
    G.shock={x:G.lx,y:G.ly,r:0,mr:120,a:.9};
    for(let i=0;i<30;i++){
      const a=Math.random()*Math.PI*2;
      G.parts.push({x:G.lx,y:G.ly,vx:Math.cos(a)*(2+Math.random()*4),vy:Math.sin(a)*(2+Math.random()*4),l:55,ml:55,c:Math.random()>.5?'#ffd700':'#9dffc6',r:3+Math.random()*3});
    }
  }
  // 检查各房间是否清空
  for(const cell of CROSS_CELLS){
    if(!G.rush.cellCleared[cell.id]&&countAliveRushEnemies(cell.id)===0){
      markRushCellCleared(cell.id);
    }
  }
  // 检查玩家当前所在房间
  for(const cell of CROSS_CELLS){
    const b=getCellBounds(cell.id);
    if(G.lx>=b.left&&G.lx<=b.right&&G.ly>=b.top&&G.ly<=b.bottom){
      if(G.currentCell!==cell.id){
        G.currentCell=cell.id;
        G.txts.push({x:G.lx,y:G.ly-G.lr-24,t:`⚔️ 进入: ${cell.name}`,l:50,ml:50,c:'#fff0b1'});
        G.shock={x:G.lx,y:G.ly,r:0,mr:70,a:.7};
      }
      break;
    }
  }
}

// 敌人发射投射物
function enemyFireProjectile(enemy,type){
  const dx=G.lx-enemy.x,dy=G.ly-enemy.y;
  const dist=Math.hypot(dx,dy)||1;
  if(type==='bullet'){
    // 小兵1：朝玩家射出子弹
    G.rushProjectiles.push({
      type:'bullet',x:enemy.x,y:enemy.y,
      vx:dx/dist*5,vy:dy/dist*5,
      r:6,damage:10,fromEnemy:true,l:240,ml:240
    });
  } else if(type==='cannonball'){
    // 中将1：朝随机方向丢出炮弹（爆炸范围伤害）
    const a=Math.random()*Math.PI*2;
    const spd=3+Math.random()*2;
    G.rushProjectiles.push({
      type:'cannonball',x:enemy.x,y:enemy.y,
      vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,
      r:12,damage:20,blastR:80,fromEnemy:true,l:180,ml:180
    });
  } else if(type==='lavapunch'){
    // 大将1：朝前直线岩浆拳头
    G.rushProjectiles.push({
      type:'lavapunch',x:enemy.x,y:enemy.y,
      vx:dx/dist*7,vy:dy/dist*7,
      r:14,damage:20,fromEnemy:true,l:999,ml:999,
      // 一直走到地图边沿
      infinite:true
    });
  }
}

function updateRushEnemies(){
  if(G.mode!==GAME_MODES.RUSH||!G.rush)return;
  for(const enemy of G.rush.enemies){
    if(!enemy.alive)continue;
    const type=ENEMY_TYPES[enemy.typeKey];
    if(!type)continue;
    if(enemy.hitCd>0)enemy.hitCd--;

    // 冲锋状态处理（中将3）
    if(enemy.chargeActive){
      enemy.x+=enemy.chargeVx;enemy.y+=enemy.chargeVy;
      enemy.chargeCd--;
      if(enemy.chargeCd<=0)enemy.chargeActive=false;
      // 冲锋期间检测碰到玩家
      const d=Math.hypot(G.lx-enemy.x,G.ly-enemy.y);
      if(d<G.lr+enemy.r+8){
        dealDamageToPlayer(30,'冲锋');
      }
      const b=getCellBounds(enemy.cellId);
      if(enemy.x<b.minX){enemy.x=b.minX;enemy.chargeActive=false;}
      if(enemy.x>b.maxX){enemy.x=b.maxX;enemy.chargeActive=false;}
      if(enemy.y<b.minY){enemy.y=b.minY;enemy.chargeActive=false;}
      if(enemy.y>b.maxY){enemy.y=b.maxY;enemy.chargeActive=false;}
      continue;
    }

    // 大将3：冰痕（途径地方留冰痕）
    if(enemy.typeKey==='admiral3'&&G.gt%10===0){
      G.iceTrails.push({x:enemy.x,y:enemy.y,r:enemy.r*0.8,l:180,ml:180});
    }

    // 移动AI
    enemy.turn--;
    if(enemy.turn<=0){
      enemy.turn=30+Math.random()*70|0;
      const dx=G.lx-enemy.x,dy=G.ly-enemy.y;
      const dist=Math.hypot(dx,dy)||1;
      const chaseStr=enemy.admiral?.65:.4;
      if(Math.random()<.6){
        enemy.vx+=dx/dist*enemy.baseSpeed*chaseStr;
        enemy.vy+=dy/dist*enemy.baseSpeed*chaseStr;
      } else {
        const a=Math.random()*Math.PI*2;
        enemy.vx+=Math.cos(a)*enemy.baseSpeed*.4;
        enemy.vy+=Math.sin(a)*enemy.baseSpeed*.4;
      }
    }
    enemy.x+=enemy.vx;enemy.y+=enemy.vy;
    enemy.vx*=.99;enemy.vy*=.99;
    const spd=Math.hypot(enemy.vx,enemy.vy);
    const maxSpd=enemy.baseSpeed*1.4;
    if(spd>maxSpd){enemy.vx*=maxSpd/spd;enemy.vy*=maxSpd/spd}
    if(spd<enemy.baseSpeed*.6&&!enemy.chargeActive){
      const a=Math.atan2(enemy.vy||.001,enemy.vx||.001)+(Math.random()-.5)*.8;
      enemy.vx=Math.cos(a)*enemy.baseSpeed*.85;
      enemy.vy=Math.sin(a)*enemy.baseSpeed*.85;
    }
    // 边界
    const b=getCellBounds(enemy.cellId);
    if(enemy.x<b.minX){enemy.x=b.minX;enemy.vx=Math.abs(enemy.vx)+enemy.baseSpeed*.2}
    if(enemy.x>b.maxX){enemy.x=b.maxX;enemy.vx=-Math.abs(enemy.vx)-enemy.baseSpeed*.2}
    if(enemy.y<b.minY){enemy.y=b.minY;enemy.vy=Math.abs(enemy.vy)+enemy.baseSpeed*.2}
    if(enemy.y>b.maxY){enemy.y=b.maxY;enemy.vy=-Math.abs(enemy.vy)-enemy.baseSpeed*.2}

    // 大将2：光剑周边持续伤害
    if(enemy.typeKey==='admiral2'){
      const d=Math.hypot(G.lx-enemy.x,G.ly-enemy.y);
      if(d<G.lr+enemy.r+14){
        if(!enemy.lightCd||enemy.lightCd<=0){
          dealDamageToPlayer(10,'光剑');
          enemy.lightCd=40;
        }
      }
      if(enemy.lightCd>0)enemy.lightCd--;
    }

    // 攻击计时器
    if(type.atkInterval>0){
      if(enemy.atkCd>0){enemy.atkCd--;}
      else{
        enemy.atkCd=type.atkInterval+(Math.random()*60|0);
        const atkType=type.atkType;
        if(atkType==='bullet'){
          enemyFireProjectile(enemy,'bullet');
        } else if(atkType==='slash'){
          // 小兵2：挥刀（扇形范围）
          const dx=G.lx-enemy.x,dy=G.ly-enemy.y;
          const a=Math.atan2(dy,dx);
          enemy.slashActive=true;enemy.slashAngle=a;enemy.slashTimer=18;
          const dist=Math.hypot(dx,dy);
          if(dist<enemy.r+80){
            const angDiff=Math.abs(((Math.atan2(G.ly-enemy.y,G.lx-enemy.x)-a+Math.PI*3)%(Math.PI*2))-Math.PI);
            if(angDiff<Math.PI/3)dealDamageToPlayer(10,'刀锋');
          }
        } else if(atkType==='cannonball'){
          enemyFireProjectile(enemy,'cannonball');
        } else if(atkType==='punch4'){
          // 中将2：四周出拳
          const dist=Math.hypot(G.lx-enemy.x,G.ly-enemy.y);
          if(dist<enemy.r+60)dealDamageToPlayer(20,'重拳');
          G.parts.push(...Array.from({length:8},(_,i)=>{
            const a=(Math.PI*2/8)*i;
            return{x:enemy.x,y:enemy.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,l:20,ml:20,c:'#ffc060',r:5};
          }));
        } else if(atkType==='charge'){
          // 中将3：冲锋
          const dx=G.lx-enemy.x,dy=G.ly-enemy.y;
          const dist=Math.hypot(dx,dy)||1;
          enemy.chargeActive=true;
          enemy.chargeVx=dx/dist*enemy.baseSpeed*2;
          enemy.chargeVy=dy/dist*enemy.baseSpeed*2;
          enemy.chargeCd=60;
          G.txts.push({x:enemy.x,y:enemy.y-enemy.r-10,t:'冲锋!',l:30,ml:30,c:'#ff8844'});
        } else if(atkType==='lavapunch'){
          enemyFireProjectile(enemy,'lavapunch');
        }
      }
    }
    if(enemy.slashTimer>0)enemy.slashTimer--;else enemy.slashActive=false;
  }
  // 更新投射物
  updateRushProjectiles();
  updateIceTrails();
}
function updateRushProjectiles(){
  for(let i=G.rushProjectiles.length-1;i>=0;i--){
    const p=G.rushProjectiles[i];
    p.x+=p.vx;p.y+=p.vy;
    p.l--;
    // 到达地图边界
    if(p.x<0||p.x>G.mW||p.y<0||p.y>G.mH){
      if(p.type==='cannonball'){explodeCannonball(p);}
      G.rushProjectiles.splice(i,1);continue;
    }
    if(p.l<=0){
      if(p.type==='cannonball'){explodeCannonball(p);}
      G.rushProjectiles.splice(i,1);continue;
    }
    // 子弹碰墙消失（格子间墙壁隔绝攻击）
    let hitWall=false;
    for(const w of G.walls){
      const wx=w.x,wy=w.y,ww=w.w/2+p.r,wh=w.h/2+p.r;
      if(Math.abs(p.x-wx)<ww&&Math.abs(p.y-wy)<wh){hitWall=true;break;}
    }
    if(hitWall){
      if(p.type==='cannonball')explodeCannonball(p);
      else{
        // 普通子弹碰墙：小火花特效
        for(let k=0;k<6;k++){const a=Math.random()*Math.PI*2;G.parts.push({x:p.x,y:p.y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,l:18,ml:18,c:'#ffe066',r:2+Math.random()*2});}
      }
      G.rushProjectiles.splice(i,1);continue;
    }
    // 碰到玩家
    const d=Math.hypot(G.lx-p.x,G.ly-p.y);
    if(d<G.lr+p.r){
      if(p.type==='cannonball'){explodeCannonball(p);}
      else dealDamageToPlayer(p.damage,p.type==='bullet'?'子弹':'岩浆拳');
      G.rushProjectiles.splice(i,1);
    }
  }
}
function explodeCannonball(p){
  // 爆炸范围伤害（中心20，往外递减）
  const d=Math.hypot(G.lx-p.x,G.ly-p.y);
  if(d<G.lr+p.blastR){
    const dmg=Math.max(1,Math.round(p.damage*(1-d/p.blastR)));
    dealDamageToPlayer(dmg,'炮弹');
  }
  for(let i=0;i<16;i++){
    const a=Math.random()*Math.PI*2;
    G.parts.push({x:p.x,y:p.y,vx:Math.cos(a)*(2+Math.random()*4),vy:Math.sin(a)*(2+Math.random()*4),l:35,ml:35,c:Math.random()>.5?'#ff8844':'#ffcc44',r:3+Math.random()*4});
  }
  G.shock={x:p.x,y:p.y,r:0,mr:p.blastR,a:.9};
}
function updateIceTrails(){
  // 更新冰减速冷却和持续计时
  if(G.iceSlowCd>0)G.iceSlowCd--;
  if(G.iceSlowActive>0){
    G.iceSlowActive--;
    // 减速持续期间：每帧将速度乘0.985（持续压制但不完全停住）
    G.lvx*=0.985;G.lvy*=0.985;
    // 蓝色粒子持续提示
    if(G.gt%12===0){
      const a=Math.random()*Math.PI*2;
      G.parts.push({x:G.lx,y:G.ly,vx:Math.cos(a)*1.2,vy:Math.sin(a)*1.2,l:22,ml:22,c:'#7fd6ff',r:2+Math.random()*2});
    }
    if(G.iceSlowActive===0){
      G.txts.push({x:G.lx,y:G.ly-G.lr-16,t:'❄️ 减速解除',l:36,ml:36,c:'#b8eaff'});
    }
  }
  for(let i=G.iceTrails.length-1;i>=0;i--){
    const t=G.iceTrails[i];
    t.l--;
    if(t.l<=0){G.iceTrails.splice(i,1);continue;}
    const d=Math.hypot(G.lx-t.x,G.ly-t.y);
    if(d<G.lr+t.r){
      // 触发一次性减速：冷却为0才可触发
      if(G.iceSlowCd<=0){
        // 立即将速度减为50%
        G.lvx*=0.5;G.lvy*=0.5;
        G.iceSlowActive=180;  // 3秒持续减速
        G.iceSlowCd=900;      // 15秒冷却
        G.txts.push({x:G.lx,y:G.ly-G.lr-16,t:'❄️ 冰封减速！-50%速度',l:50,ml:50,c:'#a8e8ff'});
        for(let j=0;j<16;j++){
          const a=Math.random()*Math.PI*2;
          G.parts.push({x:G.lx,y:G.ly,vx:Math.cos(a)*2.5,vy:Math.sin(a)*2.5,l:30,ml:30,c:'#b8eaff',r:2+Math.random()*3});
        }
      }
      // 伤害逻辑：每10秒造成一次伤害（600帧=10秒）
      if(!t.dmgCd||t.dmgCd<=0){
        dealDamageToPlayer(8,'❄️冰痕');
        t.dmgCd=600;
      }
    }
    if(t.dmgCd>0)t.dmgCd--;
  }
}
function dealDamageToPlayer(dmg,source){
  if(G.mode!==GAME_MODES.RUSH)return;
  G.hp=Math.max(0,G.hp-dmg);
  updHP();
  G.txts.push({x:G.lx,y:G.ly-G.lr-16,t:`-${dmg} ${source}`,l:40,ml:40,c:'#ff6666'});
  G.shock={x:G.lx,y:G.ly,r:0,mr:40,a:.8};
  if(G.hp<=0&&!G.rush.failQueued){
    G.rush.failQueued=true;
    setTimeout(()=>showScr('fail'),600);
  }
}

function updateRushSystems(){
  if(G.mode!==GAME_MODES.RUSH||!G.rush)return;
  updateRushSkills();
  updateRushStageProgress();
  updateRushEnemies();
  updateRushPunches();
  updateRushPickups();
  syncRushPlayerState();
}

// 拳头系统
function updateRushPunches(){
  if(G.mode!==GAME_MODES.RUSH)return;
  const n=G.punchCount;
  const st=getRushSkillStats();
  const baseR=22*(st.sizeMul||1);
  const orbitR=G.lr+baseR+14+(st.punchRangeMul||1)*8;
  const punchSpd=(st.punchSpeedMul||1)*0.06;
  // 同步拳头数量
  while(G.punches.length<n)G.punches.push({angle:Math.PI*2/n*G.punches.length,hitCd:0});
  G.punches.length=Math.min(G.punches.length,n);
  for(let i=0;i<G.punches.length;i++){
    const p=G.punches[i];
    p.angle+=punchSpd;
    // 拳头位置
    p.x=G.lx+Math.cos(p.angle)*orbitR;
    p.y=G.ly+Math.sin(p.angle)*orbitR;
    p.r=baseR;
    if(p.hitCd>0){p.hitCd--;continue;}
    // 碰敌人
    for(const enemy of G.rush.enemies){
      if(!enemy.alive)continue;
      const d=Math.hypot(p.x-enemy.x,p.y-enemy.y);
      if(d<p.r+enemy.r){
        let dmg=15*(st.damageMul||1);
        if(st.punchBlack)dmg*=2;
        dmg=Math.round(dmg);
        enemy.hp-=dmg;enemy.hitCd=6;
        const nx=(enemy.x-p.x)/(d||1),ny=(enemy.y-p.y)/(d||1);
        enemy.vx+=nx*3;enemy.vy+=ny*3;
        G.txts.push({x:enemy.x,y:enemy.y-enemy.r-6,t:`-${dmg}`,l:22,ml:22,c:st.punchBlack?'#222':st.punchWhite?'#fff':'#ffb78d'});
        G.parts.push(...Array.from({length:5},()=>{
          const a=Math.random()*Math.PI*2;
          return{x:p.x,y:p.y,vx:Math.cos(a)*(1+Math.random()*2),vy:Math.sin(a)*(1+Math.random()*2),l:18,ml:18,c:st.punchBlack?'#444':st.punchWhite?'#eef':'#ffcca0',r:2+Math.random()*2};
        }));
        p.hitCd=12;
        if(enemy.hp<=0){killEnemy(enemy);}
        break;
      }
    }
  }
}
function killEnemy(enemy){
  enemy.alive=false;enemy.vx=0;enemy.vy=0;
  G.col++;updCol();
  // 无限模式：更新波次击杀数和总击杀数
  if(G.rush){
    G.rush.waveKills=(G.rush.waveKills||0)+1;
    G.rush.totalKills=(G.rush.totalKills||0)+1;
  }
  G.txts.push({x:enemy.x,y:enemy.y,t:`击破 ${enemy.label}`,l:50,ml:50,c:'#fff0a9'});
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2;
    G.parts.push({x:enemy.x,y:enemy.y,vx:Math.cos(a)*(1.4+Math.random()*3.4),vy:Math.sin(a)*(1.4+Math.random()*3.4),l:42,ml:42,c:enemy.admiral?'#ffd46f':'#d8ecff',r:2+Math.random()*3});
  }
  sfxBreak();
}

function checkRushEnemyHits(){
  if(G.mode!==GAME_MODES.RUSH||!G.rush)return;
  const stats=getRushSkillStats();
  for(const enemy of G.rush.enemies){
    if(!enemy.alive)continue;
    const dx=G.lx-enemy.x,dy=G.ly-enemy.y;
    const dist=Math.hypot(dx,dy)||.001;
    const minDist=G.lr+enemy.r;
    if(dist>=minDist)continue;
    const nx=dx/dist,ny=dy/dist;
    const overlap=minDist-dist;
    G.lx+=nx*overlap*.56;
    G.ly+=ny*overlap*.56;
    enemy.x-=nx*overlap*.44;
    enemy.y-=ny*overlap*.44;
    if(enemy.hitCd>0)continue;
    // 玩家撞击伤害给敌人
    const relVx=G.lvx-enemy.vx,relVy=G.lvy-enemy.vy;
    const impact=Math.hypot(relVx,relVy);
    if(impact>1.5){
      let dmg=Math.max(2,Math.round(impact*5/3*(stats.damageMul||1)));
      if(stats.punchBlack)dmg=Math.round(dmg*2);
      enemy.hp-=dmg;enemy.hitCd=8;
      const knock=2.5+impact*.4;
      enemy.vx-=nx*knock;enemy.vy-=ny*knock;
      G.lvx+=nx*Math.min(2.4,impact*.15);G.lvy+=ny*Math.min(2.4,impact*.15);
      G.txts.push({x:enemy.x,y:enemy.y-enemy.r-8,t:`-${dmg}`,l:28,ml:28,c:'#ffb78d'});
      for(let i=0;i<8;i++){
        const a=Math.random()*Math.PI*2;
        G.parts.push({x:enemy.x,y:enemy.y,vx:Math.cos(a)*(1+Math.random()*2.6),vy:Math.sin(a)*(1+Math.random()*2.6),l:26,ml:26,c:enemy.admiral?'#ffe18c':'#a8d8ff',r:2+Math.random()*2});
      }
      if(enemy.hp<=0)killEnemy(enemy);
      else sfxBounce();
    }
  }
}


// === INPUT ===

function setupInput(){
  const c=G.cv;
  c.addEventListener('pointerdown',pDown);
  c.addEventListener('pointermove',pMove);
  c.addEventListener('pointerup',pUp);
  c.addEventListener('pointercancel',pUp);
}
function s2w(sx,sy){
  const s=G.rushScale||1;
  return{x:(sx-G.cx_)/s,y:(sy-G.cy_)/s};
}
function pDown(e){
  ensureAudio();
  if(G.scr!=='play')return;
  // 营救模式：空中点击触发放屁跳跃
  if(G.mode===GAME_MODES.RESCUE&&G.rescue&&G.fly&&!G.drag){
    if(G.rescue.fartLeft>0){
      G.rescue.fartLeft--;
      // 视觉缩放补偿：放屁跳跃速度也需要同步放大
      const _fartCamS = G.adventureScale||1;
      const _fartComp = _fartCamS < 1 ? (1/_fartCamS) : 1;
      // 向上方向施加额外速度
      G.lvy=Math.min(G.lvy,-7.0*_fartComp);
      G.lvx*=0.6;
      sfxLaunch();
      G.txts.push({x:G.lx,y:G.ly-20,t:'💨 放屁！',l:45,ml:45,c:'#a0ff60'});
      for(let i=0;i<14;i++){
        const a=Math.PI+Math.random()*Math.PI; // 向下方向喷出气体粒子
        G.parts.push({x:G.lx,y:G.ly+G.lr,vx:Math.cos(a)*(1+Math.random()*2.5),vy:Math.sin(a)*(1+Math.random()*2.5),l:28,ml:28,c:Math.random()>.5?'#a0ff60':'#d4ff80',r:3+Math.random()*3});
      }
      updCol();
    } else {
      G.txts.push({x:G.lx,y:G.ly-20,t:'💨 没气了！',l:35,ml:35,c:'#ff8060'});
    }
    return;
  }
  if(!G.canD||G.fly)return;
  G.drag=true;G.ds={x:e.clientX,y:e.clientY};G.dc={x:e.clientX,y:e.clientY};
  G.anch={x:G.lx,y:G.ly};
  G.cv.setPointerCapture(e.pointerId);
}
function pMove(e){
  if(!G.drag)return;
  G.dc={x:e.clientX,y:e.clientY};
  // 直接使用屏幕CSS像素距离计算蓄力，不除以camS
  // 避免手机端camS与电脑端差异导致蓄力量不一致
  const dx=G.dc.x-G.ds.x, dy=G.dc.y-G.ds.y;
  // 手机适配：蓄力距离按屏幕宽度比例计算，手机上更容易蓄满
  // 电脑端(W≈1200): maxD≈60px, 手机端(W≈375): maxD≈30px
  const _dragMaxPx = G.W * 0.05 * (G.mode===GAME_MODES.ADVENTURE?ADVENTURE_DRAG_MUL:1);
  const d=Math.min(Math.sqrt(dx*dx+dy*dy),_dragMaxPx);
  G.chg=d/_dragMaxPx;G.chgA=Math.atan2(dy,dx);
  G.chgPrev=G.chg;
}
function pUp(e){
  if(!G.drag)return;G.drag=false;
  if(G.chg<.06){G.chg=0;return}
  // === 视觉缩放补偿 ===
  // 当地图被缩放(adventureScale<1)时，1世界像素在屏幕上只显示adventureScale像素
  // 为使角色在屏幕上的视觉移动距离与adventureScale=1时一致，速度需要除以adventureScale
  const camS = (G.mode===GAME_MODES.RUSH ? (G.rushScale||1) : (G.adventureScale||1));
  const spdComp = camS < 1 ? (1/camS) : 1;
  // === 固定最大初速（px/帧），不受屏幕大小影响 ===
  // 各模式最大速度由常量直接定义，G.chg（0~1）为蓄力比例
  let maxSpd;
  if(G.mode===GAME_MODES.ADVENTURE){
    maxSpd = ADV_LAUNCH_SPD;
  } else if(G.mode===GAME_MODES.RESCUE){
    maxSpd = RESCUE_LAUNCH_SPD;
  } else {
    // 无限模式：基础速度 × 技能倍率
    const st=getRushSkillStats();
    maxSpd = RUSH_BASE_LAUNCH_SPD * (st.speedMul||1);
  }
  const pw = G.chg * maxSpd * spdComp;
  const a  = G.chgA + Math.PI; // 反向发射
  G.lvx = Math.cos(a)*pw;
  // 冒险模式：垂直速度乘以0.75，最高跳跃高度降为原来的3/4
  // 营救模式：垂直速度乘以0.707，最高跳跃高度降为1/2
  const _vertMul = G.mode===GAME_MODES.ADVENTURE ? ADV_VERT_MUL : (G.mode===GAME_MODES.RESCUE ? RESCUE_VERT_MUL : 1);
  G.lvy = Math.sin(a)*pw * _vertMul;
  G.fly=true;G.canD=false;G.bCnt=0;G.stunT=0;G.idleT=0;
  if(G.mode===GAME_MODES.RESCUE&&G.rescue){
    G.rescue.usedShots++;
    updHP();
  }


  if(G.mode===GAME_MODES.ADVENTURE){
    // Energy cost proportional to charge level (max ENERGY_MAX_COST)
    const cost=Math.max(1, Math.round(G.chg * ENERGY_MAX_COST));
    G.hp=Math.max(0, G.hp-cost);
  }
  G.chg=0;
  updHP();
  sfxLaunch();
  // === 多重冲击波特效 ===
  for(let k=0;k<3;k++){
    setTimeout(()=>{
      G.shock={x:G.lx,y:G.ly,r:0,mr:55+k*15,a:1-k*0.2};
    },k*40);
  }
  // === 白色环形爆发粒子 ===
  for(let i=0;i<20;i++){
    const pa=Math.PI*2/20*i;
    const speed=3+Math.random()*4;
    G.parts.push({
      x:G.lx,y:G.ly,
      vx:Math.cos(pa)*speed,
      vy:Math.sin(pa)*speed,
      l:35,ml:35,
      c:'#fff',r:3+Math.random()*2
    });
  }
  // === 地面放射状裂纹粒子 ===
  for(let i=0;i<12;i++){
    const pa=Math.PI*2/12*i;
    G.parts.push({
      x:G.lx,y:G.ly,
      vx:Math.cos(pa)*(1.5+Math.random()*2.5),
      vy:Math.sin(pa)*(1.5+Math.random()*2.5),
      l:45,ml:45,
      c:'rgba(139,119,101,0.8)',r:2+Math.random()*2
    });
  }
  // === 金色樱花粒子（满蓄力时） ===
  if(G.chgPrev > 0.85) {
    for(let i=0;i<15;i++){
      const pa=Math.random()*Math.PI*2;
      const speed=2+Math.random()*3;
      G.parts.push({
        x:G.lx,y:G.ly,
        vx:Math.cos(pa)*speed,
        vy:Math.sin(pa)*speed,
        l:60,ml:60,
        c:Math.random()>0.5?'rgba(255,215,0,0.9)':'rgba(255,180,100,0.8)',
        r:2+Math.random()*2,
        type:'sakura'
      });
    }
  }
  G.chgPrev=0;
}

// === PHYSICS ===
function updatePhys(){
  if(G.scr!=='play')return;
  if(G.pFreeze>0){
    G.pFreeze--;
    return;
  }
  G.gt++;G.breath+=.03;
  if(G.mode===GAME_MODES.RUSH)updateRushSystems();

  const isRescue=G.mode===GAME_MODES.RESCUE&&G.rescue;

  const wasFlying=G.fly;
  // 视觉缩放补偿：当地图缩放时，速度/重力/阈值都需要同步放大
  const _physCamS = (G.mode===GAME_MODES.RUSH ? (G.rushScale||1) : (G.adventureScale||1));
  const _physComp = _physCamS < 1 ? (1/_physCamS) : 1;
  let prevX=G.lx,prevY=G.ly,spd=0;
  if(wasFlying){
    // 营救模式：施加重力（视觉缩放补偿）
    if(isRescue){
      G.lvy+=RESCUE_GRAVITY*_physComp;
      // 限制最大下落速度（同步放大）
      if(G.lvy>12*_physComp)G.lvy=12*_physComp;
    }

    G.lx+=G.lvx;G.ly+=G.lvy;

    if(isRescue){
      // 营救模式：速度×1.5，水平摩擦同比调整保持距离不变
      G.lvx*=0.9925;
    }else if(G.mode===GAME_MODES.ADVENTURE){
      // 冒险模式：速度×2.25，摩擦加强保持飞行距离不变
      G.lvx*=0.97975;G.lvy*=0.97975;
    }else{
      const _noFric=G.mode===GAME_MODES.RUSH&&getRushSkillStats().noFric;
      if(!_noFric){G.lvx*=FRIC;G.lvy*=FRIC;}
    }
    spd=Math.sqrt(G.lvx*G.lvx+G.lvy*G.lvy);
    G.la+=spd*.04;

    if(spd>.4)G.trail.push({x:G.lx,y:G.ly,a:1,r:G.lr*(.4+spd*.015)});
    for(let i=G.trail.length-1;i>=0;i--){G.trail[i].a-=.025;if(G.trail[i].a<=0)G.trail.splice(i,1)}

    collWalls();collBlds();collWindmills();collBarrels();checkColls();

    // 营救模式：额外检测
    if(isRescue){
      checkRescueSwitches();
      checkRescueSprings();
      checkRescuePlatformLanding();
      // 着陆后滑行减速（高摩擦力渐进停下，而非瞬停）
      if(G.rescue.sliding){
        // 保持在平台表面
        if(G.rescue.onPlatform&&G.rescue.onPlatform.alive){
          const platTop=G.rescue.onPlatform.y-G.rescue.onPlatform.h/2;
          G.ly=platTop-G.lr;
          G.lvy=0;
        }
        // 高摩擦力减速：每帧速度衰减到85%
        G.lvx*=0.85;
        // 检查是否滑出平台边缘
        if(G.rescue.onPlatform){
          const p=G.rescue.onPlatform;
          if(G.lx<p.x-p.w/2+G.lr*0.3||G.lx>p.x+p.w/2-G.lr*0.3){
            // 滑出边缘，恢复自由飞行
            G.rescue.sliding=false;
            G.rescue.onPlatform=null;
            G.rescue.landedOnPlatform=false;
            G.lvy=0.5*_physComp; // 微微下落（视觉缩放补偿）
          }
        }
        // 速度足够低时自然停下（视觉缩放补偿）
        const _slCamS=G.adventureScale||1;
        if(Math.abs(G.lvx)<0.3*(_slCamS<1?1/_slCamS:1)){
          G.lvx=0;
          G.rescue.sliding=false;
          G.rescue.landedOnPlatform=false;
          G.fly=false;G.idleT=0;
          if(G.col>=G.totCol)queueRescueWin(420);
          else if(G.rescue.usedShots>=G.rescue.maxShots)queueRescueFail(500);
          else G.canD=true;
          return;
        }
      }
    }
  }
  if(G.mode===GAME_MODES.RUSH)checkRushEnemyHits();
  if(!wasFlying){
    // 营救模式idle：检查是否从平台滑落
    if(isRescue){
      // 检查脚下是否还有平台
      let onPlat=false;
      for(const b of G.blds){
        if(!b.alive||!b.isPlatform)continue;
        const platTop=b.y-b.h/2;
        const platLeft=b.x-b.w/2;
        const platRight=b.x+b.w/2;
        if(Math.abs((G.ly+G.lr)-platTop)<4&&G.lx>platLeft-G.lr*.5&&G.lx<platRight+G.lr*.5){
          onPlat=true;break;
        }
      }
      if(!onPlat){
        // 脱离平台，重新进入下落状态
        G.fly=true;
        G.lvy=0.5*_physComp;
        G.canD=false;
      }
    }
    G.idleT++;
    return;
  }

  if(G.stunT>0){G.stunT--;G.lvx*=.92;G.lvy*=.92}

  // 非rescue模式的正常停止逻辑
  // 视觉缩放补偿：停止阈值也需要同步放大
  const _camS = (G.mode===GAME_MODES.RUSH ? (G.rushScale||1) : (G.adventureScale||1));
  const _spdComp = _camS < 1 ? (1/_camS) : 1;
  const rushStopSpd = (G.mode===GAME_MODES.RUSH) ? 2.0*_spdComp : .25*_spdComp;
  if(!isRescue&&spd<rushStopSpd){
    G.lvx=0;G.lvy=0;G.fly=false;G.idleT=0;
    if(G.mode===GAME_MODES.RUSH)G.canD=true;
    else if(G.col>=G.totCol)setTimeout(()=>showScr('win'),700);
    else if(G.hp<=0)setTimeout(()=>showScr('fail'),700);
    else G.canD=true;
  }
  // rescue模式：在空中不会因为速度低停止（重力会拉它下去），除非已着陆
  if(isRescue){
    // 碰到地图底部边界：重置到最近的平台
    if(G.ly>G.mH-20){
      respawnOnLastPlatform();
    }
  }
}

// 营救模式：掉落后回到上一个安全平台
function respawnOnLastPlatform(){
  if(!G.rescue)return;
  // 找到离当前位置最近的、在当前位置以下的平台
  let best=null,bestDist=Infinity;
  for(const b of G.blds){
    if(!b.alive||!b.isPlatform)continue;
    const dy=b.y-G.rescue.highestY;
    const dist=Math.hypot(G.lx-b.x,G.rescue.highestY-b.y);
    if(dist<bestDist){bestDist=dist;best=b;}
  }
  if(!best){
    G.lx=G.mW/2;G.ly=G.mH-60;
  }else{
    G.lx=best.x;
    G.ly=best.y-best.h/2-G.lr-2;
  }
  G.lvx=0;G.lvy=0;G.fly=false;G.canD=true;G.idleT=0;
  G.txts.push({x:G.lx,y:G.ly-20,t:'⚠ 掉落了!',l:40,ml:40,c:'#ff6347'});
}





function rectCircle(rx,ry,rw,rh,cx,cy,cr){
  const left=rx-rw/2,right=rx+rw/2,top=ry-rh/2,bottom=ry+rh/2;
  const nx=Math.max(left,Math.min(cx,right));
  const ny=Math.max(top,Math.min(cy,bottom));
  const dx=cx-nx,dy=cy-ny,d=Math.sqrt(dx*dx+dy*dy);
  if(d<cr&&d>0)return{nx:dx/d,ny:dy/d,d};
  if(d===0&&cx>left&&cx<right&&cy>top&&cy<bottom){
    const dl=cx-left,dr=right-cx,dt=cy-top,db=bottom-cy;
    const minD=Math.min(dl,dr,dt,db);
    if(minD===dl)return{nx:-1,ny:0,d:-dl};
    if(minD===dr)return{nx:1,ny:0,d:-dr};
    if(minD===dt)return{nx:0,ny:-1,d:-dt};
    return{nx:0,ny:1,d:-db};
  }
  return null;
}
function pointInPoly(px,py,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    const intersect=((yi>py)!==(yj>py))&&(px<(xj-xi)*(py-yi)/((yj-yi)||0.000001)+xi);
    if(intersect)inside=!inside;
  }
  return inside;
}
function closestPointOnSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,lenSq=dx*dx+dy*dy;
  if(!lenSq)return{x:x1,y:y1};
  const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/lenSq));
  return{x:x1+dx*t,y:y1+dy*t};
}
function polyCircle(poly,cx,cy,cr){
  let closest=null,bestDist=Infinity;
  for(let i=0;i<poly.length;i++){
    const a=poly[i],b=poly[(i+1)%poly.length];
    const point=closestPointOnSeg(cx,cy,a[0],a[1],b[0],b[1]);
    const dx=cx-point.x,dy=cy-point.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<bestDist){bestDist=dist;closest={point,dx,dy};}
  }
  const inside=pointInPoly(cx,cy,poly);
  if(!inside&&bestDist>=cr)return null;
  if(bestDist===0){
    const center=poly.reduce((acc,p)=>({x:acc.x+p[0],y:acc.y+p[1]}),{x:0,y:0});
    const dx=cx-center.x/poly.length,dy=cy-center.y/poly.length;
    const len=Math.sqrt(dx*dx+dy*dy)||1;
    return{nx:dx/len,ny:dy/len,d:inside?-0.1:0};
  }
  if(inside)return{nx:(closest.point.x-cx)/bestDist,ny:(closest.point.y-cy)/bestDist,d:-bestDist};
  return{nx:closest.dx/bestDist,ny:closest.dy/bestDist,d:bestDist};
}
function hitObstacle(obstacle,cx,cy,cr){
  return obstacle.poly?polyCircle(obstacle.poly,cx,cy,cr):rectCircle(obstacle.x,obstacle.y,obstacle.w,obstacle.h,cx,cy,cr);
}

function bounce(nx,ny,dist,type){
  const ov=G.lr-dist;
  G.lx+=nx*ov;G.ly+=ny*ov;
  const dot=G.lvx*nx+G.lvy*ny;
  G.lvx-=2*dot*nx;G.lvy-=2*dot*ny;
  G.lvx*=REST;G.lvy*=REST;
  G.bCnt++;
  sfxBounce();
  // 四技能壁弹加速
  if(G.mode===GAME_MODES.RUSH){
    const st=getRushSkillStats();
    if(st.wallBounceBoost){
      G.wallBoostCount++;
      const boost=1+G.wallBoostCount*0.15;
      const spd=Math.hypot(G.lvx,G.lvy);
      if(spd>0){G.lvx*=boost;G.lvy*=boost;}
      G.txts.push({x:G.lx,y:G.ly,t:`壁弹×${G.wallBoostCount}`,l:28,ml:28,c:'#fff'});
    }
  }
  const ts=['BOOM!','BAM!','POW!','BONK!'];
  G.txts.push({x:G.lx,y:G.ly,t:ts[Math.random()*4|0],l:38,ml:38,c:type==='rubber'?'#ff69b4':'#f5c842'});
  const dc=type==='rubber'?'#ffb6c1':'#a08060';
  for(let i=0;i<7;i++){const a=Math.random()*Math.PI*2;G.parts.push({x:G.lx,y:G.ly,vx:Math.cos(a)*(1+Math.random()*2.5),vy:Math.sin(a)*(1+Math.random()*2.5),l:25,ml:25,c:dc,r:2+Math.random()*3})}
  G.trail=G.trail.map(t=>({...t,a:t.a*.65}));
  if(G.bCnt>=MAX_BOUNCE){G.stunT=STUN_T;G.lvx*=.35;G.lvy*=.35}
}

function collWalls(){for(const w of G.walls){const h=rectCircle(w.x,w.y,w.w,w.h,G.lx,G.ly,G.lr);if(h)bounce(h.nx,h.ny,h.d,'stone')}}
function collBlds(){
  const isRescue=G.mode===GAME_MODES.RESCUE&&G.rescue;
  for(let i=G.blds.length-1;i>=0;i--){
    const b=G.blds[i];
    if(b.alive===false)continue;
    const h=hitObstacle(b,G.lx,G.ly,G.lr);
    if(!h)continue;

    if(isRescue&&b.isPlatform){
      // 平台碰撞：区分顶面着陆 vs 侧面/底面反弹
      const platTop=b.y-b.h/2;
      const platLeft=b.x-b.w/2;
      const platRight=b.x+b.w/2;
      const ballBottom=G.ly+G.lr;
      // 从上方落下（法线朝上、球底接近平台顶、下落中）
      if(h.ny<-0.5&&G.lvy>0&&G.lx>platLeft-G.lr*0.4&&G.lx<platRight+G.lr*0.4){
        // 着陆！进入滑行状态
        G.ly=platTop-G.lr;
        G.lvy=0;
        G.rescue.onPlatform=b;
        G.rescue.landedOnPlatform=true;
        G.rescue.sliding=true;
        if(G.ly<G.rescue.highestY)G.rescue.highestY=G.ly;
        continue; // 不做bounce
      }
      // 侧面/底面：标准反弹
      bounce(h.nx,h.ny,h.d,'stone');
    }else if(isRescue&&b.isEdible){
      // 可食用路障：撞击扣HP
      b.hp--;
      sfxBounce();
      // 击中反馈粒子
      const hitAngle=Math.atan2(h.ny,h.nx);
      for(let j=0;j<6;j++){
        const a=hitAngle+Math.PI+(Math.random()-.5)*1.2;
        const colors={meat:'#e0923a',cheese:'#ffd700',candy:'#ff69b4'};
        G.parts.push({x:G.lx,y:G.ly,vx:Math.cos(a)*(1+Math.random()*2),vy:Math.sin(a)*(1+Math.random()*2),l:25,ml:25,c:colors[b.type]||'#e0923a',r:2+Math.random()*2});
      }
      if(b.hp<=0){
        b.alive=false;
        sfxCollect();
        pushFoodParticles(b.x,b.y,b.type);
        const foodTexts=['好吃!','吃掉了!','美味!','嗯~'];
        G.txts.push({x:b.x,y:b.y,t:foodTexts[Math.random()*foodTexts.length|0],l:45,ml:45,c:'#ffb454'});
      }else{
        G.txts.push({x:b.x,y:b.y-b.h/2-12,t:`还剩 ${b.hp} 下!`,l:35,ml:35,c:'#ffd700'});
        // 路障抖动效果
        b._shake=10;
      }
      // 撞击减速但不完全反弹（穿过感）
      bounce(h.nx,h.ny,h.d,'stone');
      G.lvx*=0.5;G.lvy*=0.5;
    }else{
      // 石门 / 非rescue模式：标准反弹
      bounce(h.nx,h.ny,h.d,'stone');
    }
  }
}

function collWindmills(){for(const w of G.windmills){const dx=G.lx-w.x,dy=G.ly-w.y,d=Math.sqrt(dx*dx+dy*dy);if(d<G.lr+w.r&&d>0)bounce(dx/d,dy/d,d-(w.r),'stone')}}

function collBarrels(){
  for(let i=G.barrels.length-1;i>=0;i--){

      for(let j=0;j<6;j++){const a=Math.random()*Math.PI*2;G.parts.push({x:b.x,y:b.y,vx:Math.cos(a)*(0.5+Math.random()*1.5),vy:Math.sin(a)*(0.5+Math.random()*1.5),l:45,ml:45,c:'#fffbe8',r:3+Math.random()*4})}
      G.txts.push({x:b.x,y:b.y,t:'CRASH!',l:40,ml:40,c:'#e67e22'});

// 鸡腿随机游荡（仅闯关模式）
function updateRushPickups(){
  if(G.mode!==GAME_MODES.RUSH)return;
  for(const c of G.colls){
    if(c.got||!c.cellId)continue;
    // 换向计时
    c.turnT=(c.turnT||0)-1;
    if(c.turnT<=0){
      const a=Math.random()*Math.PI*2;
      const spd=0.4+Math.random()*0.5;
      c.vx=Math.cos(a)*spd;c.vy=Math.sin(a)*spd;
      c.turnT=60+Math.random()*120|0;
    }
    c.x+=c.vx||0;c.y+=c.vy||0;
    // 限制在所属格子内
    const b=getCellBounds(c.cellId);
    const margin=c.r+6;
    if(c.x<b.left+margin){c.x=b.left+margin;c.vx=Math.abs(c.vx||0.4);}
    if(c.x>b.right-margin){c.x=b.right-margin;c.vx=-Math.abs(c.vx||0.4);}
    if(c.y<b.top+margin){c.y=b.top+margin;c.vy=Math.abs(c.vy||0.4);}
    if(c.y>b.bottom-margin){c.y=b.bottom-margin;c.vy=-Math.abs(c.vy||0.4);}
  }
}

function checkColls(){
  for(const c of G.colls){
    if(c.got)continue;
    const dx=G.lx-c.x,dy=G.ly-c.y;
    if(Math.sqrt(dx*dx+dy*dy)<G.lr+c.r){
      c.got=true;
      sfxCollect();
      G.pFreeze=10;
      if(G.mode===GAME_MODES.RESCUE&&c.isRescueTarget){
        // 营救模式：救到鸡腿！
        G.col++;updCol();
        G.txts.push({x:c.x,y:c.y,t:'🍗 营救成功!',l:60,ml:60,c:'#ffd700'});
        for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2;G.parts.push({x:c.x,y:c.y,vx:Math.cos(a)*(2+Math.random()*4),vy:Math.sin(a)*(2+Math.random()*4),l:55,ml:55,c:Math.random()>.5?'#ffd700':'#ff6347',r:3+Math.random()*3})}
        if(G.col>=G.totCol)queueRescueWin(600);
      }else if(G.mode===GAME_MODES.RUSH){
        const legs=c.legs||1;
        G.rush.legs+=legs;
        // 吃鸡腿：+1拳头、恢复10HP、积蓄技能
        G.punchCount++;
        G.skillCharge+=legs;
        G.hp=Math.min(G.maxHP, G.hp+20);
        updHP();
        updateRushPunches();
        updateRushSkillButtons();
        G.txts.push({x:c.x,y:c.y,t:'鸡腿! +1拳头 +20HP',l:50,ml:50,c:'#8fffbe'});
        for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2;G.parts.push({x:c.x,y:c.y,vx:Math.cos(a)*(1.3+Math.random()*3.5),vy:Math.sin(a)*(1.3+Math.random()*3.5),l:44,ml:44,c:Math.random()>.5?'#92ffbf':'#fff3b8',r:2+Math.random()*3})}
      }else{
        G.col++;updCol();
        G.txts.push({x:c.x,y:c.y,t:'Perfect!',l:50,ml:50,c:'#f5c842'});
        for(let i=0;i<18;i++){const a=Math.random()*Math.PI*2;G.parts.push({x:c.x,y:c.y,vx:Math.cos(a)*(1.5+Math.random()*4),vy:Math.sin(a)*(1.5+Math.random()*4),l:50,ml:50,c:Math.random()>.5?'#f5c842':'#fff',r:2+Math.random()*3})}
      }
    }
  }
}



function updateParts(){
  // 粒子上限：手机端防止粒子过多导致卡顿
  const MAX_PARTS = 120;
  if(G.parts.length > MAX_PARTS) G.parts.splice(0, G.parts.length - MAX_PARTS);
  for(let i=G.parts.length-1;i>=0;i--){const p=G.parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.l--;if(p.l<=0)G.parts.splice(i,1)}
  for(let i=G.txts.length-1;i>=0;i--){G.txts[i].l--;if(G.txts[i].l<=0)G.txts.splice(i,1)}
  if(G.shock){G.shock.r+=4.5;G.shock.a-=.04;if(G.shock.a<=0)G.shock=null}
}

// === CAMERA ===
function updateCam(){
  if(G.mode===GAME_MODES.RUSH&&G.rush){
    // 闯关模式：缩放使当前格子填满屏幕，玩家始终居中
    const targetScale=Math.min(G.W/RUSH_CELL_SIZE,G.H/RUSH_CELL_SIZE)*0.92;
    if(G.rushCamScale===undefined)G.rushCamScale=targetScale;
    else G.rushCamScale+=(targetScale-G.rushCamScale)*0.08;
    const s=G.rushCamScale;
    const cell=CROSS_CELLS.find(cc=>cc.id===G.currentCell)||CROSS_CELLS[0];
    const b=getCellBounds(cell.id);
    const cellW=b.right-b.left, cellH=b.bottom-b.top;
    const scaledW=cellW*s, scaledH=cellH*s;
    let tx,ty;
    if(scaledW<=G.W){
      // 格子比屏幕小：居中格子
      tx=G.W/2-b.cx*s;
    }else{
      // 格子比屏幕大：以玩家为中心，不超出格子边界
      tx=G.W/2-G.lx*s;
      const minTx=G.W-b.right*s;
      const maxTx=-b.left*s;
      if(minTx<=maxTx)tx=Math.max(minTx,Math.min(maxTx,tx));
      else tx=(minTx+maxTx)/2; // 极端情况：取中间
    }
    if(scaledH<=G.H){
      ty=G.H/2-b.cy*s;
    }else{
      ty=G.H/2-G.ly*s;
      const minTy=G.H-b.bottom*s;
      const maxTy=-b.top*s;
      if(minTy<=maxTy)ty=Math.max(minTy,Math.min(maxTy,ty));
      else ty=(minTy+maxTy)/2;
    }
    if(G.rushCamTx===undefined){G.rushCamTx=tx;G.rushCamTy=ty;}
    else{
      G.rushCamTx+=(tx-G.rushCamTx)*0.12;
      G.rushCamTy+=(ty-G.rushCamTy)*0.12;
    }
    G.cx_=G.rushCamTx;G.cy_=G.rushCamTy;
    G.rushScale=s;
    return;
  }
  G.rushCamScale=undefined;G.rushCamTx=undefined;G.rushCamTy=undefined;G.rushScale=1;
  // 营救模式：缩放使地图宽度适配屏幕，Y轴跟随角色
  if(G.mode===GAME_MODES.RESCUE&&G.mW>0&&G.mH>0){
    // 以屏幕宽度填满地图宽度为基准，保持地图可视区域足够大
    const rescueScale=G.W/G.mW;
    G.adventureScale=rescueScale;
    const s=rescueScale;
    // X轴：地图居中
    const scaledW=G.mW*s;
    let tx=(G.W-scaledW)/2;
    // Y轴：跟随角色，角色始终在屏幕垂直60%处（偏上）
    let ty=G.H*0.6-G.ly*s;
    // 上下边界：不超出地图
    const minTy=G.H-G.mH*s;
    if(ty<minTy)ty=minTy;
    if(ty>0)ty=0;
    G.cx_+=(tx-G.cx_)*0.12;
    G.cy_+=(ty-G.cy_)*0.12;
    return;
  }
  // 手机适配：计算地图缩放比例，让地图在屏幕中完整显示
  const mapFitScaleX=G.W/G.mW;
  const mapFitScaleY=G.H/G.mH;
  // 当地图比屏幕大时才缩放；地图比屏幕小时不缩放，保持1:1
  G.adventureScale=1;
  if(G.mW>G.W||G.mH>G.H){
    G.adventureScale=Math.min(mapFitScaleX,mapFitScaleY)*0.96;
  }
  const s=G.adventureScale;
  if(s!==1){
    // 缩放模式：以玩家为中心，不超出地图
    let tx=G.W/2-G.lx*s;
    let ty=G.H/2-G.ly*s;
    const minTx=G.W-G.mW*s; const maxTx=0;
    const minTy=G.H-G.mH*s; const maxTy=0;
    if(minTx<=maxTx)tx=Math.max(minTx,Math.min(maxTx,tx));
    else tx=(minTx+maxTx)/2;
    if(minTy<=maxTy)ty=Math.max(minTy,Math.min(maxTy,ty));
    else ty=(minTy+maxTy)/2;
    G.cx_+=(tx-G.cx_)*.12;
    G.cy_+=(ty-G.cy_)*.12;
  }else{
    let tx=G.W/2-G.lx,ty=G.H/2-G.ly;
    if(G.mW<=G.W)tx=(G.W-G.mW)/2;
    else tx=Math.max(G.W-G.mW,Math.min(0,tx));
    if(G.mH<=G.H)ty=(G.H-G.mH)/2;
    else ty=Math.max(G.H-G.mH,Math.min(0,ty));
    G.cx_+=(tx-G.cx_)*.1;
    G.cy_+=(ty-G.cy_)*.1;
  }
}


// === RENDER ===
function render(){
  const c=G.cx;
  c.clearRect(0,0,G.W,G.H);
  c.fillStyle='#1a1a1a';c.fillRect(0,0,G.W,G.H);
  if(G.scr==='play'||G.scr==='pause'){
    c.save();
    if(G.mode===GAME_MODES.RUSH&&G.rushScale&&G.rushScale!==1){
      // 闯关模式变换：先平移到cx_/cy_，再以原点为基准缩放
      // 世界坐标 wx 映射到屏幕：wx * scale + cx_
      // cx_ = W/2 - lx*scale，所以玩家lx -> W/2（正中心）
      c.translate(G.cx_,G.cy_);
      c.scale(G.rushScale,G.rushScale);
    }else if(G.adventureScale&&G.adventureScale!==1){
      // 冒险/营救模式手机缩放：先平移后缩放
      c.translate(G.cx_,G.cy_);
      c.scale(G.adventureScale,G.adventureScale);
    }else{
      c.translate(G.cx_,G.cy_);
    }
    if(G.mode===GAME_MODES.RESCUE)drawRescueBackground(c);
    else if(G.mode===GAME_MODES.RUSH)drawRushBackground(c);
    else drawLevelBackground(c);
    drawWalls(c);
    drawBlds(c);
    if(G.mode===GAME_MODES.RESCUE)drawRescueExtras(c);
    drawWindmillStructures(c);
    drawBarrels(c);
    if(G.mode===GAME_MODES.RUSH)drawRushEnemies(c);
    drawColls(c);
    drawTrail(c);
    drawDragPrev(c);
    drawShock(c);
    drawParts(c);
    drawLuffy(c);
    if(G.mode===GAME_MODES.RUSH){drawRushPunches(c);drawRushProjectilesGfx(c);drawIceTrailsGfx(c);}
    drawTxts(c);
    if(G.mode===GAME_MODES.RUSH)drawPlayerHealthBar(c);
    c.restore();
    // 小地图已删除
  }
}



// === 绘制关卡背景 ===
function drawLevelBackground(c){
  const img = levelImages[G.lvl];
  if(img && img.complete && img.naturalWidth > 0){
    // 如果图片加载成功，绘制背景图片
    c.drawImage(img, 0, 0, G.mW, G.mH);
  } else {
    // 如果图片还没加载或失败，使用简单的彩色背景作为后备
    drawSimpleBackground(c);
  }
}

// === 简单背景（后备方案）===
function drawSimpleBackground(c){
  const levelColors = [
    '#6daa3c',
    '#c9a85c',
    '#c8e0f0',
    '#d4a856',
    '#e8f0f8',
    '#88a8c8',
    '#e8e0d0',
    '#4a3a5a',
    '#d8a8c8',
    '#4a68a8',
    '#a86858',
    '#e8c8d8',
    '#d8c898',
  ];
  c.fillStyle = levelColors[G.lvl] || '#6daa3c';
  c.fillRect(0, 0, G.mW, G.mH);
  c.strokeStyle = 'rgba(0,0,0,0.1)';
  c.lineWidth = 1;
  for(let x = 0; x < G.mW; x += 50) {
    c.beginPath();
    c.moveTo(x, 0);

}
