function drawRushBackground(c){
  if(!G.rush)return;
  const C=RUSH_CELL_SIZE;
  // 整体背景（角落区域暗色）
  c.fillStyle='#0a0a1a';
  c.fillRect(0,0,G.mW,G.mH);
  // 角落遮罩（非十字区域）
  c.fillStyle='rgba(0,0,0,.72)';
  c.fillRect(0,0,C,C);
  c.fillRect(2*C,0,C,C);
  c.fillRect(0,2*C,C,C);
  c.fillRect(2*C,2*C,C,C);
  // 十字区域背景（使用地砖图片）
  for(const cell of CROSS_CELLS){
    const b=getCellBounds(cell.id);
    const cellIndex = CROSS_CELLS.indexOf(cell);
    const tileImg = RUSH_TILE_BG_IMAGES[cellIndex];
    // 绘制地砖背景图
    if(tileImg && tileImg.complete && tileImg.naturalWidth > 0){
      c.drawImage(tileImg, b.left, b.top, C, C);
    } else {
      // 后备方案：渐变背景
      const cellColors={
        center:['#18355a','#0f2444'],
        top:   ['#1a3a20','#0d2010'],
        right: ['#3a2010','#201008'],
        bottom:['#2a1a3a','#180d22'],
        left:  ['#2a1a0a','#180d04'],
      };
      const cols=cellColors[cell.id]||['#18355a','#0f2444'];
      const grad=c.createLinearGradient(b.left,b.top,b.right,b.bottom);
      grad.addColorStop(0,cols[0]);grad.addColorStop(1,cols[1]);
      c.fillStyle=grad;
      c.fillRect(b.left,b.top,C,C);
    }
    // 边框
    const active=G.currentCell===cell.id;
    c.strokeStyle=active?'rgba(173,224,255,.38)':'rgba(255,255,255,.1)';
    c.lineWidth=active?3:1;
    c.strokeRect(b.left+14,b.top+14,C-28,C-28);
    // 房间标题
    const alive=countAliveRushEnemies(cell.id);
    c.fillStyle='#ffe7a8';
    c.font='900 18px "Segoe UI","Microsoft YaHei",sans-serif';
    c.textAlign='left';
    if(!alive&&G.rush.cellCleared[cell.id]){
      c.fillStyle='rgba(108,255,175,.14)';
      c.fillRect(b.left+20,b.top+80,C-40,C-100);
      c.fillStyle='rgba(162,255,205,.88)';
      c.font='900 38px "Segoe UI","Microsoft YaHei",sans-serif';
      c.textAlign='center';
      c.fillText('CLEAR',b.cx,b.cy+14);
    } else if(active){
      c.fillStyle='rgba(255,232,177,.88)';
      c.font='700 14px "Segoe UI","Microsoft YaHei",sans-serif';
      c.textAlign='left';
      c.fillText(`剩余: ${alive} 人`,b.left+32,b.top+68);
      // 进度条
      const totalInCell=G.rush.enemies.filter(e=>e.cellId===cell.id).length;
      const progress=totalInCell?(totalInCell-alive)/totalInCell:0;
      c.fillStyle='rgba(255,255,255,.15)';
      c.fillRect(b.left+32,b.top+76,C-64,7);
      c.fillStyle='rgba(108,255,175,.7)';
      c.fillRect(b.left+32,b.top+76,(C-64)*progress,7);
    }
  }
  // 无限模式：门始终开启，不绘制门标记
  // 波次信息（替代终点标记）
  if(G.rush.goal){
    const goal=G.rush.goal;
    const wave=G.rush.wave||1;
    c.fillStyle='rgba(255,215,0,.18)';
    c.beginPath();c.arc(goal.x,goal.y,goal.r+14,0,Math.PI*2);c.fill();
    c.strokeStyle='rgba(255,215,0,.6)';
    c.lineWidth=3;
    c.beginPath();c.arc(goal.x,goal.y,goal.r,0,Math.PI*2);c.stroke();
    c.fillStyle='#ffd700';
    c.font='900 16px "Segoe UI","Microsoft YaHei",sans-serif';
    c.textAlign='center';
    c.fillText(`第${wave}波`,goal.x,goal.y-4);
    c.font='700 11px "Segoe UI","Microsoft YaHei",sans-serif';
    c.fillStyle='rgba(255,215,0,.8)';
    c.fillText(`总击杀:${G.rush.totalKills||0}`,goal.x,goal.y+14);
  }
  c.textAlign='left';
}
function drawCrossDoor(c,door){
  const open=door.open;
  const T=RUSH_DOOR_THICKNESS;
  const dW=RUSH_DOOR_WIDTH;
  c.save();
  if(door.axis==='v'){
    // 竖向门（left和right之间）
    const wallTopH=door.cy-dW/2-door.top;
    const wallBotH=door.bottom-(door.cy+dW/2);
    if(open){
      c.fillStyle='rgba(108,255,175,.18)';
      c.fillRect(door.x-T*.6,door.cy-dW/2,T*1.2,dW);
      c.strokeStyle='rgba(144,255,195,.78)';c.lineWidth=2;
      c.strokeRect(door.x-T*.6,door.cy-dW/2,T*1.2,dW);
      c.fillStyle='rgba(216,255,232,.94)';c.font='700 11px sans-serif';c.textAlign='center';
      c.fillText('开',door.x,door.cy+4);
    } else {
      // 关闭：整条通道全封，无开口
      const fullH=door.bottom-door.top;
      c.fillStyle='rgba(69,38,24,.92)';c.fillRect(door.x-T/2,door.top,T,fullH);
      c.strokeStyle='rgba(255,222,165,.42)';c.lineWidth=1;
      c.strokeRect(door.x-T/2,door.top,T,fullH);
      // 门口标记
      c.fillStyle='rgba(255,237,204,.9)';c.font='700 11px sans-serif';c.textAlign='center';
      c.fillText('封',door.x,door.cy+4);
    }
  } else {
    // 水平门（top和bottom之间）
    const wallLeftW=door.cx-dW/2-door.left;
    const wallRightW=door.right-(door.cx+dW/2);
    if(open){
      c.fillStyle='rgba(108,255,175,.18)';
      c.fillRect(door.cx-dW/2,door.y-T*.6,dW,T*1.2);
      c.strokeStyle='rgba(144,255,195,.78)';c.lineWidth=2;
      c.strokeRect(door.cx-dW/2,door.y-T*.6,dW,T*1.2);
      c.fillStyle='rgba(216,255,232,.94)';c.font='700 11px sans-serif';c.textAlign='center';
      c.fillText('开',door.cx,door.y+4);
    } else {
      // 关闭：整条通道全封，无开口
      const fullW=door.right-door.left;
      c.fillStyle='rgba(69,38,24,.92)';c.fillRect(door.left,door.y-T/2,fullW,T);
      c.strokeStyle='rgba(255,222,165,.42)';c.lineWidth=1;
      c.strokeRect(door.left,door.y-T/2,fullW,T);
      c.fillStyle='rgba(255,237,204,.9)';c.font='700 11px sans-serif';c.textAlign='center';
      c.fillText('封',door.cx,door.y+4);
    }
  }
  c.textAlign='left';
  c.restore();
}
function drawRushEnemies(c){
  if(!G.rush)return;
  for(const enemy of G.rush.enemies){
    if(!enemy.alive)continue;
    c.save();
    c.translate(enemy.x,enemy.y);
    // 阴影
    c.fillStyle='rgba(0,0,0,.22)';
    c.beginPath();c.ellipse(3,5,enemy.r*.9,enemy.r*.56,0,0,Math.PI*2);c.fill();
    // 使用图标图片
    const img=enemyImages[enemy.typeKey];
    if(img&&img.complete&&img.naturalWidth>0){
      c.beginPath();c.arc(0,0,enemy.r,0,Math.PI*2);c.clip();
      c.drawImage(img,-enemy.r,-enemy.r,enemy.r*2,enemy.r*2);
    } else {
      // 无图时fallback
      const body=c.createRadialGradient(-enemy.r*.25,-enemy.r*.35,0,0,0,enemy.r);
      body.addColorStop(0,enemy.color);body.addColorStop(1,enemy.accent);
      c.fillStyle=body;c.beginPath();c.arc(0,0,enemy.r,0,Math.PI*2);c.fill();
      c.fillStyle='rgba(255,255,255,.9)';c.font=`900 ${Math.max(10,enemy.r*.46)}px sans-serif`;
      c.textAlign='center';c.fillText(enemy.admiral?'将':'海',0,enemy.r*.18);
    }
    c.restore();
    c.save();c.translate(enemy.x,enemy.y);
    // 血条
    const barW=enemy.r*2.2,barH=6;
    const barX=-barW/2,barY=-enemy.r-14;
    c.fillStyle='rgba(0,0,0,.55)';c.fillRect(barX-1,barY-1,barW+2,barH+2);
    c.fillStyle='#333';c.fillRect(barX,barY,barW,barH);
    const hpPct=Math.max(0,enemy.hp/enemy.maxHP);
    const hpColor=hpPct>.5?`hsl(${hpPct*120},80%,45%)`:`hsl(${hpPct*60},80%,48%)`;
    c.fillStyle=hpColor;c.fillRect(barX,barY,barW*hpPct,barH);
    // 名字
    c.font='600 10px "Segoe UI","Microsoft YaHei",sans-serif';
    c.fillStyle='rgba(255,255,255,.92)';c.textAlign='center';
    c.fillText(enemy.label,0,enemy.r+16);
    // 挥刀特效
    if(enemy.slashActive&&enemy.slashTimer>0){
      const a=enemy.slashAngle;
      const alpha=enemy.slashTimer/18;
      c.save();c.globalAlpha=alpha;
      c.strokeStyle='rgba(200,220,255,.85)';c.lineWidth=3;
      for(let s=-1;s<=1;s++){
        const sa=a+s*Math.PI/4;
        c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(sa)*(enemy.r+80),Math.sin(sa)*(enemy.r+80));c.stroke();
      }
      c.restore();
    }
    // 大将2光剑光环
    if(enemy.typeKey==='admiral2'){
      const gl=c.createRadialGradient(0,0,enemy.r*.8,0,0,enemy.r+18);
      gl.addColorStop(0,'rgba(255,255,128,.15)');gl.addColorStop(1,'rgba(255,255,0,0)');
      c.fillStyle=gl;c.beginPath();c.arc(0,0,enemy.r+18,0,Math.PI*2);c.fill();
      c.strokeStyle=`rgba(255,255,0,${0.4+Math.sin(G.gt*.2)*0.3})`;c.lineWidth=2;
      c.beginPath();c.arc(0,0,enemy.r+10,0,Math.PI*2);c.stroke();
    }
    c.textAlign='left';
    c.restore();
  }
}
function drawRushPunches(c){

    c.save();c.translate(p.x,p.y);
    const pColor=st.punchBlack?'#222222':st.punchWhite?'#ffffff':'#ffaa44';
    const glow=c.createRadialGradient(0,0,0,0,0,p.r);
    glow.addColorStop(0,pColor);
    glow.addColorStop(1,st.punchBlack?'rgba(0,0,0,0)':st.punchWhite?'rgba(255,255,255,0)':'rgba(255,140,0,0)');
    c.fillStyle=glow;c.beginPath();c.arc(0,0,p.r,0,Math.PI*2);c.fill();
    // 拳头图案（简单圆+指节）
    c.strokeStyle=st.punchBlack?'rgba(80,80,80,.8)':st.punchWhite?'rgba(200,220,255,.8)':'rgba(255,180,60,.8)';

    c.restore();
  }
}

function drawGrass(c){
  // Base green
  c.fillStyle='#6daa3c';
  c.fillRect(0,0,G.mW,G.mH);
  // Texture
  const seed=42;
  for(let gx=30;gx<G.mW-30;gx+=14){
    for(let gy=30;gy<G.mH-30;gy+=14){
      const s=((gx*31+gy*17+seed)%100);
      if(s<35){
        c.fillStyle=s<15?'rgba(90,170,55,.25)':'rgba(110,190,60,.2)';
        c.fillRect(gx,gy,8+s%5,8+s%4);
      }
    }
  }
  // Small grass tufts
  c.strokeStyle='rgba(80,150,40,.3)';c.lineWidth=1;
  for(let i=0;i<120;i++){
    const gx=35+((i*137+51)%((G.mW-70)|1));
    const gy=35+((i*97+23)%((G.mH-70)|1));
    c.beginPath();c.moveTo(gx,gy);c.lineTo(gx-2,gy-5);c.moveTo(gx,gy);c.lineTo(gx+2,gy-4);c.stroke();
  }
}

function drawRoadPath(c,pts,outerW,innerW){
  if(pts.length<2)return;
  // Outer (border)
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);
  c.lineWidth=outerW;c.strokeStyle='#a09888';c.lineCap='round';c.lineJoin='round';c.stroke();
  // Inner (surface)
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);
  c.lineWidth=innerW;c.strokeStyle='#c4b8a4';c.stroke();
  // Center dashes
  c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);
  c.lineWidth=1;c.strokeStyle='rgba(255,255,255,.1)';c.setLineDash([6,10]);c.stroke();c.setLineDash([]);
}

// --- 十字地图围墙可视化 ---
function drawWalls(c){
  if(G.mode===GAME_MODES.RUSH&&G.rush){
    const C=RUSH_CELL_SIZE;
    const doorW=RUSH_DOOR_WIDTH;
    const doorT=RUSH_DOOR_THICKNESS;
    c.save();

    // ========== 1. 外边框 ==========
    c.strokeStyle='rgba(180,150,100,.7)';
    c.lineWidth=6;
    c.strokeRect(0,0,G.mW,G.mH);
    c.strokeStyle='rgba(220,190,140,.35)';
    c.lineWidth=2;
    c.strokeRect(3,3,G.mW-6,G.mH-6);

    // ========== 2. 四个角落（不可通行区域）==========
    const corners=[[0,0],[2,0],[0,2],[2,2]];
    for(const [col,row] of corners){
      const x=col*C,y=row*C;
      // 深色填充
      c.fillStyle='rgba(40,30,20,.85)';
      c.fillRect(x+2,y+2,C-4,C-4);
      // 斜纹图案
      c.strokeStyle='rgba(80,60,40,.4)';
      c.lineWidth=1;
      for(let i=-C;i<C*2;i+=18){
        c.beginPath();c.moveTo(x+i,y);c.lineTo(x+i+C,y+C);c.stroke();
      }
      // 边框
      c.strokeStyle='rgba(160,120,80,.6)';
      c.lineWidth=3;
      c.strokeRect(x+2,y+2,C-4,C-4);
      // "X"标记
      c.strokeStyle='rgba(200,80,60,.5)';
      c.lineWidth=3;
      c.beginPath();c.moveTo(x+30,y+30);c.lineTo(x+C-30,y+C-30);c.stroke();
      c.beginPath();c.moveTo(x+C-30,y+30);c.lineTo(x+30,y+C-30);c.stroke();
      // 文字标签
      c.fillStyle='rgba(200,80,60,.7)';
      c.font='bold 14px "Segoe UI","Microsoft YaHei",sans-serif';
      c.textAlign='center';
      c.fillText('不可通行',x+C/2,y+C/2);
    }

    // ========== 3. 格子间分隔墙 + 门开口 ==========
    // 门全部开启状态下的墙体可视化
    for(const door of G.rush.doors){
      if(door.axis==='h'){
        // 水平门（center-top在y=C, center-bottom在y=2C）
        const doorLeft=door.cx-doorW/2;
        const doorRight=door.cx+doorW/2;
        // 左侧实体墙
        if(doorLeft-door.left>1){
          drawWallSegment(c,door.left,door.y-doorT/2,doorLeft-door.left,doorT,'h');
        }
        // 右侧实体墙
        if(door.right-doorRight>1){
          drawWallSegment(c,doorRight,door.y-doorT/2,door.right-doorRight,doorT,'h');
        }
        // 门开口（绿色高亮可通行区）
        c.fillStyle='rgba(80,220,120,.15)';
        c.fillRect(doorLeft,door.y-doorW/2,doorW,doorW);
        c.strokeStyle='rgba(80,220,120,.5)';
        c.lineWidth=2;
        c.setLineDash([8,4]);
        c.strokeRect(doorLeft,door.y-doorW/2,doorW,doorW);
        c.setLineDash([]);
        // 箭头
        c.fillStyle='rgba(80,220,120,.7)';
        c.font='bold 12px sans-serif';c.textAlign='center';
        c.fillText('▼ 可通行 ▼',door.cx,door.y+4);
      } else {
        // 竖向门（center-left在x=C, center-right在x=2C）
        const doorTop=door.cy-doorW/2;
        const doorBot=door.cy+doorW/2;
        // 上方实体墙
        if(doorTop-door.top>1){
          drawWallSegment(c,door.x-doorT/2,doorTop,doorT,doorTop-door.top,'v');
        }
        // 下方实体墙
        if(door.bottom-doorBot>1){
          drawWallSegment(c,door.x-doorT/2,doorBot,doorT,door.bottom-doorBot,'v');
        }
        // 门开口（绿色高亮可通行区）
        c.fillStyle='rgba(80,220,120,.15)';
        c.fillRect(door.x-doorW/2,doorTop,doorW,doorW);
        c.strokeStyle='rgba(80,220,120,.5)';
        c.lineWidth=2;
        c.setLineDash([8,4]);
        c.strokeRect(door.x-doorW/2,doorTop,doorW,doorW);
        c.setLineDash([]);
        // 箭头
        c.fillStyle='rgba(80,220,120,.7)';
        c.font='bold 12px sans-serif';c.textAlign='center';
        c.fillText('► 可通行 ◄',door.x,door.cy+4);
      }
    }

    // ========== 4. 波次目标显示 ==========
    if(G.rush.goal){
      const goal=G.rush.goal;
      const wave=G.rush.wave||1;
      c.fillStyle='rgba(255,215,0,.18)';
      c.beginPath();c.arc(goal.x,goal.y,goal.r+10,0,Math.PI*2);c.fill();
      c.strokeStyle='rgba(255,215,0,.6)';
      c.lineWidth=3;
      c.beginPath();c.arc(goal.x,goal.y,goal.r,0,Math.PI*2);c.stroke();
      c.fillStyle='#ffd700';
      c.font='900 14px "Segoe UI","Microsoft YaHei",sans-serif';
      c.textAlign='center';
      c.textBaseline='alphabetic';
      c.fillText(`W${wave}`,goal.x,goal.y+5);
    }

    c.textAlign='left';
    c.textBaseline='alphabetic';
    c.restore();
    return;
  }
}

// 绘制单个墙体段（带立体效果）
function drawWallSegment(c,x,y,w,h,axis){
  // 主体
  const grad=c.createLinearGradient(x,y,x+(axis==='h'?w:0),y+(axis==='v'?h:0));
  grad.addColorStop(0,'rgba(90,65,45,.9)');
  grad.addColorStop(0.5,'rgba(120,85,55,.9)');
  grad.addColorStop(1,'rgba(70,50,35,.9)');
  c.fillStyle=grad;
  roundRect(c,x,y,w,h,3);
  c.fill();
  // 高光边
  c.strokeStyle='rgba(180,150,110,.5)';
  c.lineWidth=1.5;
  roundRect(c,x,y,w,h,3);
  c.stroke();
  // 顶部亮线
  c.strokeStyle='rgba(220,195,155,.3)';
  c.lineWidth=1;
  c.beginPath();
  if(axis==='h'){
    c.moveTo(x+2,y+1);c.lineTo(x+w-2,y+1);
  }else{
    c.moveTo(x+1,y+2);c.lineTo(x+1,y+h-2);
  }
  c.stroke();
}

// 圆角矩形辅助函数
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.lineTo(x+w-r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.lineTo(x,y+h-r);
  c.arcTo(x,y,x+r,y+h,r);
  c.closePath();
}







// --- Buildings（营救模式平台）---
function drawBlds(c){
  if(G.mode!==GAME_MODES.RESCUE)return;
  for(const b of G.blds){
    if(b.alive===false)continue;
    if(b.isEdible)continue;
    c.save();
    const left=b.x-b.w/2,top_=b.y-b.h/2;

    if(b.isGate){
      // 石门
      const rr=4;
      c.fillStyle='rgba(0,0,0,.18)';c.fillRect(left+2,top_+2,b.w,b.h);
      const gGrad=c.createLinearGradient(left,top_,left,top_+b.h);
      gGrad.addColorStop(0,'#7a6a55');gGrad.addColorStop(1,'#3a2a1a');
      c.fillStyle=gGrad;
      c.beginPath();c.moveTo(left+rr,top_);c.lineTo(left+b.w-rr,top_);
      c.arcTo(left+b.w,top_,left+b.w,top_+rr,rr);c.lineTo(left+b.w,top_+b.h-rr);
      c.arcTo(left+b.w,top_+b.h,left+b.w-rr,top_+b.h,rr);c.lineTo(left+rr,top_+b.h);
      c.arcTo(left,top_+b.h,left,top_+b.h-rr,rr);c.lineTo(left,top_+rr);
      c.arcTo(left,top_,left+rr,top_,rr);c.closePath();c.fill();
      c.strokeStyle='rgba(180,150,100,.4)';c.lineWidth=1.5;
      for(let x=left+12;x<left+b.w-5;x+=14){c.beginPath();c.moveTo(x,top_+2);c.lineTo(x,top_+b.h-2);c.stroke();}
      c.font='bold 13px sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.fillStyle='rgba(255,220,150,.9)';c.fillText('🔒',b.x,b.y);
    }else if(b.type==='ground'){
      // 地面：绿草+泥土
      const dg=c.createLinearGradient(left,top_,left,top_+b.h);
      dg.addColorStop(0,'#7a9a50');dg.addColorStop(0.3,'#6a5a3a');dg.addColorStop(1,'#4a3a2a');
      c.fillStyle=dg;c.fillRect(left,top_,b.w,b.h);
      c.fillStyle='#5a8a38';c.fillRect(left,top_,b.w,5);
    }else{
      // 石头平台：使用预渲染缓存（避免每帧使用filter/shadow）
      const stoneName=b.stoneName||'灰色中石';
      const stImg=rescueStoneImages[stoneName];
      if(stImg&&stImg.complete&&stImg.naturalWidth>0){
        const cached=getStoneCache(stImg,stoneName,b.w,b.h);
        const pad=12;
        c.drawImage(cached,left-pad,top_-pad,b.w+pad*2,b.h+pad*2);
      }else{
        // 后备：彩色渐变（根据stoneName选色）
        const stoneColors={
          '黄色短石':['#f0c84a','#c89020'],'黄色中石':['#f0c84a','#c89020'],'黄色长石':['#f0c84a','#c89020'],
          '灰色短石':['#a8b8c0','#6a7880'],'灰色中石':['#a8b8c0','#6a7880'],'灰色长石':['#a8b8c0','#6a7880'],
          '紫色短石':['#c078e0','#7840a8'],'紫色中石':['#c078e0','#7840a8'],'紫色长石':['#c078e0','#7840a8'],
        };
        const cols=stoneColors[stoneName]||['#a8b8c0','#6a7880'];
        const sg=c.createLinearGradient(left,top_,left,top_+b.h);
        sg.addColorStop(0,cols[0]);sg.addColorStop(1,cols[1]);
        c.fillStyle=sg;c.fillRect(left,top_,b.w,b.h);
        c.fillStyle='rgba(255,255,255,0.2)';c.fillRect(left+3,top_+1,b.w-6,2);
      }
    }
    c.restore();
  }
}


// --- Windmill structures (solid) ---
function drawWindmillStructures(c){
  for(const w of G.windmills){
    c.save();c.translate(w.x,w.y);
    // Shadow
    c.fillStyle='rgba(0,0,0,.12)';c.beginPath();c.arc(3,3,w.r,0,Math.PI*2);c.fill();
    // Base (cream colored cylindrical top view)
    const bg=c.createRadialGradient(-4,-4,0,0,0,w.r);
    bg.addColorStop(0,'#f5f0e0');bg.addColorStop(1,'#d8d0c0');
    c.fillStyle=bg;c.beginPath();c.arc(0,0,w.r,0,Math.PI*2);c.fill();
    c.strokeStyle='#a09080';c.lineWidth=1.5;c.beginPath();c.arc(0,0,w.r,0,Math.PI*2);c.stroke();
    // Blades
    const ba=G.gt*.035;
    for(let i=0;i<4;i++){
      const a=ba+(Math.PI/2)*i;
      const bx=Math.cos(a),by=Math.sin(a);
      // Blade arm
      c.strokeStyle='#5a4a3a';c.lineWidth=2.5;
      c.beginPath();c.moveTo(0,0);c.lineTo(bx*w.r*1.1,by*w.r*1.1);c.stroke();
      // Blade surface
      c.fillStyle='rgba(220,210,190,.7)';
      c.beginPath();
      c.moveTo(bx*6,by*6);
      c.lineTo(bx*w.r*1.1,by*w.r*1.1);
      c.lineTo(Math.cos(a+.3)*w.r*.85,Math.sin(a+.3)*w.r*.85);
      c.closePath();c.fill();
    }
    // Center hub
    c.fillStyle='#4a3a2a';c.beginPath();c.arc(0,0,4,0,Math.PI*2);c.fill();
    c.fillStyle='#6a5a4a';c.beginPath();c.arc(-1,-1,2,0,Math.PI*2);c.fill();
    c.restore();
  }
}

// --- Trail ---
function drawTrail(c){
  for(const t of G.trail){
    const a=t.a*.55;
    const ratio=t.a;
    let r,g,b;
    if(ratio>.66){r=255;g=80;b=60}else if(ratio>.33){r=80;g=100;b=255}else{r=200;g=210;b=255}
    c.fillStyle=`rgba(${r},${g},${b},${a})`;
    c.beginPath();c.arc(t.x,t.y,t.r*t.a,0,Math.PI*2);c.fill();
  }
}


// --- Drag preview ---
function drawDragPrev(c){
  if(!G.drag||G.chg<.06)return;
  c.save();
  const ax=G.anch.x,ay=G.anch.y;
  // maxD为屏幕像素单位，绘制时需转换为世界坐标单位
  // 与pMove保持一致：蓄力距离按屏幕宽度比例计算
  const _maxDScreen=G.W*0.05*(G.mode===GAME_MODES.ADVENTURE?ADVENTURE_DRAG_MUL:1);
  const _camS=(G.mode===GAME_MODES.RUSH?(G.rushScale||1):(G.adventureScale||1));
  const maxD=_maxDScreen/_camS;

  // === 1. 地面放射状裂纹和螺旋风压 ===
  if(G.chg > 0.3) {
    c.save();
    c.translate(ax, ay);
    // 放射状裂纹
    c.strokeStyle = `rgba(139, 119, 101, ${0.3 + G.chg * 0.4})`;
    c.lineWidth = 2;
    for(let i = 0; i < 8; i++) {
      const a = (Math.PI * 2 / 8) * i + G.gt * 0.01;
      c.beginPath();
      c.moveTo(Math.cos(a) * 10, Math.sin(a) * 10);
      c.lineTo(Math.cos(a) * (20 + G.chg * 30), Math.sin(a) * (20 + G.chg * 30));
      c.stroke();
    }
    // 螺旋风压
    c.strokeStyle = `rgba(255, 255, 255, ${0.15 + G.chg * 0.25})`;
    c.lineWidth = 1.5;
    for(let r = 15; r < 45 + G.chg * 20; r += 10) {
      c.beginPath();
      c.arc(0, 0, r, 0 + G.gt * 0.02, Math.PI * 1.5 + G.gt * 0.02);
      c.stroke();
    }
    c.restore();
  }

  // === 2. 锚点 - 固定红色圆圈 ===
  c.save();
  c.translate(ax, ay);
  // 外圆环
  c.strokeStyle = 'rgba(231, 76, 60, 0.7)';
  c.lineWidth = 3;
  c.setLineDash([5, 5]);
  c.beginPath();
  c.arc(0, 0, G.lr + 12, 0, Math.PI * 2);
  c.stroke();
  c.setLineDash([]);
  // 内闪烁圆点
  const pulse = 0.5 + Math.sin(G.gt * 0.08) * 0.5;
  c.fillStyle = `rgba(231, 76, 60, ${0.4 + pulse * 0.4})`;
  c.beginPath();
  c.arc(0, 0, 6 + pulse * 3, 0, Math.PI * 2);
  c.fill();
  c.restore();

  // === 3. 蓄力环（日式家纹）旋转填充 ===
  c.save();
  c.translate(ax, ay);
  c.rotate(G.gt * 0.03);
  c.strokeStyle = `rgba(245, 200, 66, ${0.4 + G.chg * 0.5})`;
  c.lineWidth = 3;
  c.beginPath();
  c.arc(0, 0, 35, -Math.PI/2, -Math.PI/2 + Math.PI * 2 * G.chg);
  c.stroke();
  // 家纹装饰
  if(G.chg > 0.2) {
    for(let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 / 6) * i;
      const r = 38;
      c.fillStyle = `rgba(245, 200, 66, ${G.chg * 0.6})`;
      c.beginPath();
      c.arc(Math.cos(a) * r, Math.sin(a) * r, 3, 0, Math.PI * 2);
      c.fill();
    }
  }
  // 满蓄力金色樱花爆发
  if(G.chg > 0.95) {
    for(let i = 0; i < 8; i++) {
      const a = (Math.PI * 2 / 8) * i + G.gt * 0.05;
      const r = 50 + Math.sin(G.gt * 0.1 + i) * 5;
      c.save();
      c.translate(Math.cos(a) * r, Math.sin(a) * r);
      c.rotate(a + Math.PI/4);
      c.fillStyle = `rgba(255, 200, 100, ${0.6 + Math.sin(G.gt * 0.15) * 0.3})`;
      // 画樱花
      for(let p = 0; p < 5; p++) {
        const pa = (Math.PI * 2 / 5) * p;
        c.beginPath();
        c.ellipse(Math.cos(pa)*5, Math.sin(pa)*5, 4, 6, pa, 0, Math.PI*2);
        c.fill();
      }
      c.restore();
    }
  }
  c.restore();

  // === 4. 半透明胶质手臂 ===
  const maxStr = G.chg * maxD * 0.5;
  const ex = ax + Math.cos(G.chgA) * maxStr;
  const ey = ay + Math.sin(G.chgA) * maxStr;
  const armPerpA = G.chgA + Math.PI/2;
  
  for(let side = -1; side <= 1; side += 2) {
    c.save();
    const armOffset = side * 12;
    // 手臂起点（草帽两侧）
    const startX = ax - Math.cos(G.chgA) * G.lr * 0.5 + Math.cos(armPerpA) * armOffset;
    const startY = ay - Math.sin(G.chgA) * G.lr * 0.5 + Math.sin(armPerpA) * armOffset;
    
    // 绘制胶质手臂 - 半透明条状
    const armGrad = c.createLinearGradient(startX, startY, ex, ey);
    armGrad.addColorStop(0, `rgba(255, 180, 200, ${0.3 + G.chg * 0.3})`);
    armGrad.addColorStop(0.5, `rgba(255, 150, 180, ${0.4 + G.chg * 0.3})`);
    armGrad.addColorStop(1, `rgba(255, 100, 150, ${0.3 + G.chg * 0.3})`);
    
    c.strokeStyle = armGrad;
    c.lineWidth = 6 + G.chg * 4;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(startX, startY);
    // 手臂有一些波动效果
    for(let i = 0; i <= 10; i++) {
      const t = i / 10;
      const midX = startX + (ex - startX) * t;
      const midY = startY + (ey - startY) * t;
      const waveX = Math.sin(t * Math.PI * 2 + G.gt * 0.05) * 3 * side;
      const waveY = Math.cos(t * Math.PI * 2 + G.gt * 0.05) * 2;
      c.lineTo(midX + waveX, midY + waveY);
    }
    c.stroke();
    
    // 手臂末端爪状抓地效果
    c.save();
    c.translate(ex, ey);
    c.rotate(G.chgA);
    c.fillStyle = `rgba(255, 200, 220, ${0.5 + G.chg * 0.3})`;
    for(let claw = 0; claw < 3; claw++) {
      const ca = -Math.PI/4 + (Math.PI/4) * claw;
      c.beginPath();
      c.ellipse(Math.cos(ca)*8, Math.sin(ca)*8, 3, 6, ca, 0, Math.PI*2);
      c.fill();
    }
    // 指节发白效果
    c.fillStyle = `rgba(255, 255, 255, ${0.4 + G.chg * 0.3})`;
    c.beginPath();
    c.arc(0, 0, 5, 0, Math.PI*2);
    c.fill();
    c.restore();
    c.restore();
  }

  // === 5. 双螺旋轨迹线（绿渐变至红） ===
  for(let side = -1; side <= 1; side += 2) {
    c.beginPath();
    for(let i = 0; i <= 25; i++) {
      const t = i / 25;
      const mx = ax + (ex - ax) * t;
      const my = ay + (ey - ay) * t;
      const helixR = 8 + G.chg * 4;
      const helixPhase = t * Math.PI * 4 + G.gt * 0.03;
      const px_ = -Math.sin(G.chgA) * Math.sin(helixPhase) * helixR * side;
      const py_ = Math.cos(G.chgA) * Math.sin(helixPhase) * helixR * side;
      if(i === 0) c.moveTo(mx + px_, my + py_);
      else c.lineTo(mx + px_, my + py_);
    }
    const hg = c.createLinearGradient(ax, ay, ex, ey);
    hg.addColorStop(0, `rgba(46, 204, 113, ${0.5 + G.chg * 0.3})`);
    hg.addColorStop(0.5, `rgba(241, 196, 15, ${0.5 + G.chg * 0.3})`);
    hg.addColorStop(1, `rgba(231, 76, 60, ${0.5 + G.chg * 0.3})`);
    c.strokeStyle = hg;
    c.lineWidth = 3;
    c.stroke();
  }

  // === 6. 预测轨迹 ===
  const la = G.chgA + Math.PI;
  // 与pUp保持一致：直接用固定最大初速×蓄力比例×视觉缩放补偿
  const _predCamS = (G.mode===GAME_MODES.RUSH ? (G.rushScale||1) : (G.adventureScale||1));
  const _predComp = _predCamS < 1 ? (1/_predCamS) : 1;
  let _predMaxSpd;
  if(G.mode===GAME_MODES.ADVENTURE){
    _predMaxSpd = ADV_LAUNCH_SPD;
  } else if(G.mode===GAME_MODES.RESCUE){
    _predMaxSpd = RESCUE_LAUNCH_SPD;
  } else {
    const _st=getRushSkillStats();
    _predMaxSpd = RUSH_BASE_LAUNCH_SPD * (_st.speedMul||1);
  }
  const pw = G.chg * _predMaxSpd * _predComp;
  let px = ax, py = ay, pvx = Math.cos(la)*pw;
  // 冒险模式垂直速度同步乘以0.75，营救模式同步乘以0.707
  const _predVertMul = G.mode===GAME_MODES.ADVENTURE ? ADV_VERT_MUL : (G.mode===GAME_MODES.RESCUE ? RESCUE_VERT_MUL : 1);
  let pvy = Math.sin(la)*pw * _predVertMul;
  const isRescuePred = G.mode===GAME_MODES.RESCUE;

  const pts = [[px, py]];
  let bn = 0;
  // 营救模式：模拟200帧（满弦垂直向上约12px/帧，到顶需~67帧，完整抛物线~134帧，200帧足够）
  const maxPredSteps = isRescuePred ? 200 : 80;
  for(let i = 0; i < maxPredSteps && bn < 2; i++) {
    if(isRescuePred){
      pvy += RESCUE_GRAVITY * _predComp;
      if(pvy > 12*_predComp) pvy = 12*_predComp;
      pvx *= 0.995;
    }else if(G.mode===GAME_MODES.ADVENTURE){
      pvx *= 0.97975; pvy *= 0.97975;
    }else{
      pvx *= FRIC; pvy *= FRIC;
    }
    px += pvx; py += pvy;
    for(const w of G.walls){
      const h = rectCircle(w.x,w.y,w.w,w.h,px,py,G.lr);
      if(h){const dot=pvx*h.nx+pvy*h.ny;pvx-=2*dot*h.nx;pvy-=2*dot*h.ny;pvx*=REST;pvy*=REST;bn++}
    }
    for(const b of G.blds){
      if(b.alive===false)continue;
      const h = hitObstacle(b,px,py,G.lr);
      if(h){const dot=pvx*h.nx+pvy*h.ny;pvx-=2*dot*h.nx;pvy-=2*dot*h.ny;pvx*=REST;pvy*=REST;bn++}
    }

    pts.push([px, py]);
  }
  if(pts.length > 1) {
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
    for(let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    const gr = c.createLinearGradient(pts[0][0], pts[0][1], pts[pts.length-1][0], pts[pts.length-1][1]);
    gr.addColorStop(0, 'rgba(100, 220, 180, 0.7)');
    gr.addColorStop(1, 'rgba(220, 70, 50, 0.7)');
    c.strokeStyle = gr; c.lineWidth = 3; c.setLineDash([6, 8]); c.stroke(); c.setLineDash([]);
  }

  // === 7. 体力消耗显示 ===
  const cost = Math.max(1, Math.round(G.chg * ENERGY_MAX_COST));
  c.font = 'bold 12px sans-serif';
  c.textAlign = 'center';
  c.fillStyle = 'rgba(0,0,0,0.5)';
  c.fillText('-' + cost, ax + 1, ay - G.lr - 20 + 1);
  c.fillStyle = 'rgba(255, 255, 255, 0.9)';
  c.fillText('-' + cost, ax, ay - G.lr - 20);

  c.restore();
}

// --- Shockwave ---
function drawShock(c){
  if(!G.shock)return;
  const s=G.shock;
  c.save();c.strokeStyle=`rgba(255,255,255,${s.a})`;c.lineWidth=2.5;
  c.beginPath();c.arc(s.x,s.y,s.r,0,Math.PI*2);c.stroke();
  // Inner ring
  c.strokeStyle=`rgba(255,240,200,${s.a*.6})`;c.lineWidth=1.5;
  c.beginPath();c.arc(s.x,s.y,s.r*.7,0,Math.PI*2);c.stroke();
  c.restore();
}

// --- Particles ---
function drawParts(c){
  for(const p of G.parts){
    const a=p.l/p.ml;
    c.globalAlpha=a;
    
    if(p.type==='sakura'){
      // 樱花花瓣特效
      c.save();
      c.translate(p.x,p.y);
      c.rotate((1-a)*Math.PI*3 + p.vx);
      c.fillStyle=p.c;
      // 画五瓣樱花
      for(let petal=0; petal<5; petal++){
        const pa = (Math.PI*2/5)*petal;
        c.beginPath();
        c.ellipse(
          Math.cos(pa)*p.r*0.8, 
          Math.sin(pa)*p.r*0.8, 
          p.r*0.4*a, 
          p.r*0.7*a, 
          pa, 
          0, 
          Math.PI*2
        );
        c.fill();
      }
      c.restore();
    } else {
      // 普通圆形粒子
      c.fillStyle=p.c;
      c.beginPath();
      c.arc(p.x,p.y,p.r*a,0,Math.PI*2);
      c.fill();
    }
  }
  c.globalAlpha=1;
}

// --- Luffy ---
function drawLuffy(c){
  c.save();c.translate(G.lx,G.ly);
  const spd=Math.sqrt(G.lvx*G.lvx+G.lvy*G.lvy);
  const bo=Math.sin(G.breath)*1.2;
  const r=G.lr+(G.fly?0:bo*.25);

  // 变形
  let sx=1,sy=1;
  if(G.drag){
    const stretchDir=G.chgA;
    c.rotate(stretchDir);
    sx=1+G.chg*0.5;sy=1-G.chg*0.2;
  }else if(G.fly&&spd>1.5){
    const ma=Math.atan2(G.lvy,G.lvx);
    c.rotate(ma);
    sx=1+spd*.008;sy=1-spd*.004;
  }
  c.scale(sx,sy);

  // 阴影
  const ssc=G.fly?1.15:1,sa=G.fly?.1:.18;
  c.fillStyle=`rgba(0,0,0,${sa})`;
  c.beginPath();c.ellipse(2,3,r*ssc,r*ssc*.7,0,0,Math.PI*2);c.fill();

  // 使用路飞emoji图片绘制
  const luffyImg=enemyImages['player'];
  if(luffyImg&&luffyImg.complete&&luffyImg.naturalWidth>0){
    c.save();
    c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.clip();
    c.drawImage(luffyImg,-r,-r,r*2,r*2);
    c.restore();
    // 边框
    c.strokeStyle=G.hp<=20?'rgba(255,80,80,.9)':'rgba(255,215,0,.7)';
    c.lineWidth=2;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();
  }else{
    // Fallback：草帽圆
    c.fillStyle=G.hp<=20?'#c8b870':'#e8b830';
    c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
    c.fillStyle=G.hp<=20?'#d4c882':'#f5c842';
    c.beginPath();c.arc(0,0,r*.62,0,Math.PI*2);c.fill();
    c.fillStyle=G.hp<=20?'#905050':'#d63031';
    c.beginPath();c.arc(0,0,r*.7,0,Math.PI*2);c.fill();
    c.fillStyle=G.hp<=20?'#d4c882':'#f5c842';
    c.beginPath();c.arc(0,0,r*.56,0,Math.PI*2);c.fill();
    c.strokeStyle=G.hp<=20?'#998':'#c89620';c.lineWidth=1.5;
    c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();
  }
  if(G.mode===GAME_MODES.RUSH)drawRushAura(c,r);

  // 蓄力叠加光效
  if(G.drag&&G.chg>0.1){
    const tensionAlpha=G.chg*0.45;
    c.fillStyle=`rgba(255,${Math.floor(165-G.chg*80)},0,${tensionAlpha})`;
    c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.fill();
  }

  // 眩晕星星
  if(G.stunT>0){
    for(let i=0;i<5;i++){
      const a=G.gt*.08+(Math.PI*2/5)*i;
      c.fillStyle='#f5c842';c.font='10px sans-serif';
      c.fillText('✦',Math.cos(a)*(r+8)-4,Math.sin(a)*(r+8)+4);
    }
  }
  // 低血量出汗
  if(G.hp<=20){
    const sa2=G.gt*.06;
    c.fillStyle='rgba(100,180,255,.6)';
    c.beginPath();c.ellipse(r*.65,-r*.25+Math.sin(sa2)*2.5,1.8,3,0,0,Math.PI*2);c.fill();
  }
  // 速度光环
  if(G.fly&&spd>3){
    c.strokeStyle=`rgba(255,255,255,${Math.min(spd*.04,.35)})`;c.lineWidth=1;
    for(let i=1;i<=2;i++){c.beginPath();c.arc(0,0,r+i*4.5,0,Math.PI*2);c.stroke()}
  }
  // 待机脉冲
  if(!G.fly&&!G.drag&&G.canD&&G.idleT>IDLE_T){
    const pa=.25+.25*Math.sin(G.gt*.06);
    c.strokeStyle=`rgba(255,255,255,${pa})`;c.lineWidth=2;
    c.beginPath();c.arc(0,0,r+7+Math.sin(G.gt*.04)*3,0,Math.PI*2);c.stroke();
  }
  c.restore();
}

// --- Text effects ---
function drawTxts(c){
  for(const te of G.txts){
    const a=te.l/te.ml;
    const yo=(1-a)*-28;
    const sc=.55+a*.55;
    c.save();c.translate(te.x,te.y+yo);c.scale(sc,sc);c.globalAlpha=a;
    c.font='bold 17px "Comic Sans MS",cursive,sans-serif';c.textAlign='center';
    c.fillStyle='#000';c.fillText(te.t,1.5,1.5);
    c.fillStyle=te.c;c.fillText(te.t,0,0);
    c.restore();
  }
  c.globalAlpha=1;
}

// --- Mini map ---
function drawMiniMap(){
  const mc=document.getElementById('miniMapCanvas');
  const x=mc.getContext('2d');
  const mw=mc.width,mh=mc.height;
  x.clearRect(0,0,mw,mh);
  const sx=mw/G.mW,sy=mh/G.mH;
  if(G.mode===GAME_MODES.RUSH&&G.rush){
    x.fillStyle='rgba(15,28,44,.88)';x.fillRect(0,0,mw,mh);
    for(let stage=0;stage<G.rush.stageCount;stage++){
      const active=stage===G.rush.currentStage;
      x.fillStyle=active?'rgba(96,172,255,.34)':(stage%2?'rgba(58,97,156,.38)':'rgba(41,73,129,.42)');
      x.fillRect(stage*G.rush.stageWidth*sx,0,G.rush.stageWidth*sx,mh);
    }
    x.strokeStyle='rgba(255,255,255,.14)';x.lineWidth=1;
    for(let stage=1;stage<G.rush.stageCount;stage++){
      const px=stage*G.rush.stageWidth*sx;
      x.beginPath();x.moveTo(px,0);x.lineTo(px,mh);x.stroke();
    }
    for(const door of G.rush.doors){
      if(!door.open){
        const px=door.x*sx;
        x.fillStyle='#ffc27f';
        x.fillRect(px-1.5,mh*.34,3,mh*.32);
      }
    }
    if(G.rush.goal){
      x.fillStyle='#ffd700';
      x.beginPath();x.arc(G.rush.goal.x*sx,G.rush.goal.y*sy,3.5,0,Math.PI*2);x.fill();
    }
    for(const enemy of G.rush.enemies){
      if(!enemy.alive)continue;
      x.fillStyle=enemy.admiral?'#ffd46f':'#9dd4ff';
      x.beginPath();x.arc(enemy.x*sx,enemy.y*sy,enemy.admiral?3.2:2.2,0,Math.PI*2);x.fill();
    }
    for(const co of G.colls){if(co.got)continue;x.fillStyle='#ffb454';x.beginPath();x.arc(co.x*sx,co.y*sy,2.4,0,Math.PI*2);x.fill()}
    x.fillStyle='#ff5c5c';x.beginPath();x.arc(G.lx*sx,G.ly*sy,3.2,0,Math.PI*2);x.fill();
    x.strokeStyle='rgba(255,255,255,.48)';x.strokeRect(-G.cx_*sx,-G.cy_*sy,G.W*sx,G.H*sy);
    return;
  }
  if(G.mode===GAME_MODES.RESCUE){
    const sx2=mw/G.mW,sy2=mh/G.mH;
    // 背景渐变
    const grad=x.createLinearGradient(0,0,0,mh);
    grad.addColorStop(0,'rgba(26,42,108,.8)');
    grad.addColorStop(0.5,'rgba(135,206,235,.6)');
    grad.addColorStop(1,'rgba(90,138,60,.6)');
    x.fillStyle=grad;x.fillRect(0,0,mw,mh);
    // 画平台
    for(const b of G.blds){
      if(b.alive===false)continue;
      if(b.isEdible){
        const ecols={meat:'rgba(224,146,58,.8)',cheese:'rgba(255,215,0,.8)',candy:'rgba(255,105,180,.8)'};
        x.fillStyle=ecols[b.type]||'rgba(224,146,58,.8)';
      }else if(b.isGate)x.fillStyle='rgba(180,140,80,.8)';
      else if(b.type==='gold')x.fillStyle='rgba(255,215,0,.9)';
      else if(b.type==='ground')x.fillStyle='rgba(90,130,60,.7)';
      else x.fillStyle='rgba(138,128,112,.7)';
      x.fillRect((b.x-b.w/2)*sx2,(b.y-b.h/2)*sy2,b.w*sx2,Math.max(b.h*sy2,2));
    }
    // 画机关
    if(G.rescue){
      for(const sw of G.rescue.switches){
        x.fillStyle=sw.activated?'#00cc66':'#ff8c00';
        x.beginPath();x.arc(sw.x*sx2,sw.y*sy2,3,0,Math.PI*2);x.fill();
      }
      // 画弹簧
      for(const sp of G.rescue.springs){
        x.fillStyle='#ff4444';
        x.fillRect(sp.x*sx2-2,sp.y*sy2-2,4,4);
      }
    }
    // 画鸡腿目标
    for(const co of G.colls){if(co.got)continue;x.fillStyle='#ffd700';x.beginPath();x.arc(co.x*sx2,co.y*sy2,3.5,0,Math.PI*2);x.fill()}
    // 画玩家
    x.fillStyle='#ff4040';x.beginPath();x.arc(G.lx*sx2,G.ly*sy2,3,0,Math.PI*2);x.fill();
    x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=1;
    x.strokeRect(-G.cx_*sx2,-G.cy_*sy2,G.W*sx2,G.H*sy2);
    return;
  }
  const sx2=mw/G.mW,sy2=mh/G.mH;
  x.fillStyle='rgba(80,140,55,.55)';x.fillRect(0,0,mw,mh);
  x.fillStyle='rgba(200,55,55,.5)';
  for(const b of G.blds)x.fillRect((b.x-b.w/2)*sx2,(b.y-b.h/2)*sy2,b.w*sx2,b.h*sy2);
  x.fillStyle='rgba(200,190,170,.5)';
  for(const w of G.windmills){x.beginPath();x.arc(w.x*sx2,w.y*sy2,w.r*sx2,0,Math.PI*2);x.fill()}
  for(const co of G.colls){if(co.got)continue;x.fillStyle='#e8913a';x.beginPath();x.arc(co.x*sx2,co.y*sy2,2.5,0,Math.PI*2);x.fill()}
  x.fillStyle='#ff4040';x.beginPath();x.arc(G.lx*sx2,G.ly*sy2,3,0,Math.PI*2);x.fill();
  x.strokeStyle='rgba(255,255,255,.4)';x.lineWidth=1;
  x.strokeRect(-G.cx_*sx2,-G.cy_*sy2,G.W*sx2,G.H*sy2);
}



// === LOOP ===
// 固定物理时间步：目标 60fps（16.667ms/帧）
// 无论实际帧率多少，物理每次只步进固定步长，保证速度/距离与帧率无关
const PHYS_STEP = 1000 / 60; // ms
const MAX_PHYS_STEPS = 3; // 手机端防止帧率低时物理步进过多导致恶性循环
let _lastT = 0;
let _accumT = 0;
function loop(t){
  if(_lastT === 0) _lastT = t;
  let dt = t - _lastT;
  _lastT = t;
  // 防止切换标签页/后台恢复时一次性积累过多（上限4帧）
  if(dt > PHYS_STEP * 4) dt = PHYS_STEP * 4;
  if(G.scr==='play'){
    _accumT += dt;
    // 物理步进上限：防止低帧率设备上计算恶性循环
    let _steps = 0;
    while(_accumT >= PHYS_STEP && _steps < MAX_PHYS_STEPS){
      updatePhys();updateParts();
      _accumT -= PHYS_STEP;
      _steps++;
    }
    // 如果还有剩余未执行的物理步，丢弃（避免累积）
    if(_accumT >= PHYS_STEP) _accumT = 0;
    updateCam();
    render();
  }else if(G.scr==='pause'){
    // 暂停页仅保留最后一帧画面，不继续进行物理和粒子更新。
    _accumT=0;
    render();
  }else{
    // 选择页和主菜单由 DOM 覆盖，无须持续清空或绘制 Canvas。
    _accumT=0;
  }
  requestAnimationFrame(loop);
}

window.addEventListener('load',init);
